name: Deploy Test to Cloudflare Pages

on:
  push:
    branches: [staging]

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy static site to Cloudflare Pages (test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name crewcall-test --branch staging

  post-linear:
    name: Comment test URL on Linear tickets
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      TEST_URL: https://crewcall-test.pages.dev
    steps:
      - name: Post test URL to tickets referenced in this push
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          API = "https://api.linear.app/graphql"
          MARKER = "<!-- hermes-test-url -->"
          KEY = os.environ.get("LINEAR_API_KEY", "")
          TEST_URL = os.environ.get("TEST_URL", "")

          tickets = set()
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          try:
              with open(event_path) as f:
                  ev = json.load(f)
              for c in ev.get("commits", []):
                  for tok in re.findall(r"\b(BLD-\d+)\b", c.get("message", ""), re.I):
                      tickets.add(tok.upper())
          except Exception as e:
              print("could not read event:", e)

          if not KEY or not tickets:
              print("no LINEAR_API_KEY or no tickets referenced in this push; nothing to post")
              raise SystemExit(0)

          def gql(q):
              req = urllib.request.Request(API, data=json.dumps({"query": q}).encode(),
                  headers={"Authorization": KEY, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          for ident in sorted(tickets):
              try:
                  d = gql('{ issue(id:"%s"){ id identifier title comments(first:50){ nodes{ id body } } } }' % ident)
                  iss = d.get("data", {}).get("issue")
                  if not iss:
                      print(f"{ident}: not resolvable, skip"); continue
                  body = "🎛️ **Test area (staging)** — ready to try\\n\\n🔗 " + TEST_URL + "\\n" + MARKER + " " + TEST_URL + "\\n"
                  existing = next((c for c in iss["comments"]["nodes"] if MARKER in (c.get("body") or "")), None)
                  if existing:
                      res = gql('mutation{ commentUpdate(id:"%s", input:{ body:%s }){ success } }' % (existing["id"], json.dumps(body)))
                      action = "updated"
                  else:
                      res = gql('mutation{ commentCreate(input:{ issueId:"%s", body:%s }){ success } }' % (iss["id"], json.dumps(body)))
                      action = "created"
                  ok = bool(next(iter(res.get("data", {}).values()), {}).get("success"))
                  print(f"{ident} — {iss['title'][:40]}: {action} ({ok})")
              except Exception as e:
                  print(f"{ident}: error {e}")

          print("done.")
          PY