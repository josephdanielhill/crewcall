name: Playwright E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11. Node 20 ships npm 10, whose arborist fails with
          # "Cannot read properties of null (reading 'edgesOut')" while resolving
          # vitest's optional peer set (build-ideal-tree.js #loadPeerSet).
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=html,github

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7