name: Release

# Semantic versioning + changelog, driven by Conventional Commits.
# Opens a "Release PR" that bumps the version + writes CHANGELOG.md; merging that
# PR creates the git tag and a GitHub Release. No manual version bumping.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
