<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewCall - Interval Rowing Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:oklch(0.975 0.016 230);}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:oklch(0.85 0.016 230);border-radius:8px;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  button{font-family:inherit;}

  #app {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    color: oklch(0.26 0.022 255);
  }
  .app-left {
    flex: 0 0 57%;
    position: relative;
    display: flex;
    flex-direction: column;
    border-right: 1px solid oklch(0.9 0.016 230);
    transition: flex 0.75s cubic-bezier(0.76, 0, 0.24, 1), border-color 0.75s ease;
  }
  .app-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: oklch(0.985 0.015 230);
    min-width: 0;
    transition: transform 0.75s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.75s ease, flex 0.75s cubic-bezier(0.76, 0, 0.24, 1);
  }
  #app.mode-advance .app-left {
    flex: 0 0 100%;
    border-right: none;
  }
  #app.mode-advance .app-right {
    flex: 0 0 0%;
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }
  .left-container {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 60px;
    background: oklch(0.972 0.016 230);
  }
  .active-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px 36px;
  }
  .setup-metrics-row {
    display: flex;
    align-items: flex-end;
    gap: 40px;
  }
  .setup-time-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 110px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: oklch(0.3 0.012 70);
  }
  .setup-count-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 52px;
    line-height: 1;
    color: oklch(0.42 0.012 70);
  }

  .btn-start{background:#005B96;}
  .btn-start:hover{background:#004a7a;}
  .btn-soft:hover{background:oklch(0.97 0.016 230);}
  .btn-danger:hover{background:oklch(0.97 0.02 27);}
  .btn-surprise:hover{background:oklch(0.97 0.025 27);}
  .btn-stepper:hover{background:oklch(0.95 0.016 230);}
  .btn-stepper-soft:hover{background:oklch(0.95 0.016 230);}
  .btn-disabled{opacity:0.3;pointer-events:none;}

  @media (max-width: 768px) {
    #app {
      flex-direction: column;
      height: auto;
      overflow-y: auto;
    }
    .app-left {
      flex: 0 0 auto;
      width: 100%;
      border-right: none;
      border-bottom: 1px solid oklch(0.9 0.016 230);
    }
    .app-right {
      flex: 0 0 auto;
      width: 100%;
      background: oklch(0.985 0.015 230);
    }
    #app.mode-advance .app-right {
      display: none;
    }
    .left-container {
      position: relative;
      inset: auto;
      padding: 48px 16px;
      gap: 30px;
      min-height: 440px;
      align-items: center;
      text-align: center;
    }
    .left-container > div {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .setup-metrics-row {
      gap: 20px;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
    }
    .setup-time-val {
      font-size: clamp(56px, 14vw, 84px);
    }
    .setup-count-val {
      font-size: clamp(32px, 8vw, 44px);
    }
    .active-inner {
      position: relative;
      inset: auto;
      padding: 32px 16px;
      gap: 32px;
      min-height: 480px;
      width: 100%;
      align-items: stretch;
    }
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: oklch(0.26 0.022 255);
    color: oklch(0.97 0.006 85);
    padding: 12px 24px;
    border-radius: 12px;
    box-shadow: 0 10px 30px oklch(0.3 0.022 255 / 0.15);
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .timeline-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .timeline-card.dragging {
    opacity: 0.4;
    border: 2px dashed oklch(0.7 0.02 230) !important;
    background: oklch(0.97 0.01 230) !important;
    transform: scale(0.98);
  }
  .timeline-cards-container::-webkit-scrollbar {
    width: 6px;
  }
  .timeline-cards-container::-webkit-scrollbar-thumb {
    background: oklch(0.85 0.016 230);
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="app-left"></div>
  <div class="app-right"></div>
</div>
<input type="file" id="config-upload-input" accept=".json" style="display:none">

<script>
(function(){
  "use strict";

  var app = document.getElementById('app');

  var COLORS = {
    high:   { name:'EXTREME', fill:'oklch(0.71 0.145 27)',  tint:'oklch(0.93 0.05 27)',  ink:'oklch(0.45 0.15 27)' },
    medium: { name:'HARD',    fill:'oklch(0.83 0.12 82)',   tint:'oklch(0.93 0.06 82)',  ink:'oklch(0.52 0.12 70)' },
    med:    { name:'MEDIUM',  fill:'oklch(0.78 0.09 190)',  tint:'oklch(0.93 0.05 190)', ink:'oklch(0.48 0.09 190)' },
    low:    { name:'LOW',     fill:'oklch(0.80 0.095 158)', tint:'oklch(0.93 0.05 158)', ink:'oklch(0.46 0.09 160)' },
  };
  var RATIOS = { high:2, medium:3, med:3.5, low:4 };
  var MINLEN = 15;
  var SOUND_ENABLED = true;
  var COUNTDOWN_BEEPS = true;

  var state = {
    mode: 'setup',
    config: {
      high:   {count:2, len:45,  rate:30},
      medium: {count:2, len:90,  rate:28},
      med:    {count:3, len:105, rate:26},
      low:    {count:4, len:120, rate:24}
    },
    targetMin: 10,
    elapsed: 0, baseElapsed: 0, runStart: 0,
    sequence: [], ends: [], totalDuration: 0,
    lastSegIndex: -1, lastCountTick: null, raf: null, actx: null,
    advancedSequence: [],
    advancedEdited: false,
    isAdvancedWorkout: false,
  };

  function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }

  function arrange(h,m,md,l){
    var firstLow = false;
    var lastLow = false;
    var remL = l;
    
    if (remL > 0) {
      firstLow = true;
      remL--;
    }
    if (remL > 0) {
      lastLow = true;
      remL--;
    }
    
    var pools = { high: h, medium: m, med: md, low: remL };
    var total = h + m + md + remL;
    var remaining = { high: pools.high, medium: pools.medium, med: pools.med, low: pools.low };
    var placed = { high: 0, medium: 0, med: 0, low: 0 };
    var order = ['low', 'med', 'medium', 'high', 'medium', 'med'];
    var middleSeq = [];
    var prev = firstLow ? 'low' : null;
    
    for (var i = 0; i < total; i++) {
      var best = null, bestScore = -Infinity;
      var progress = (i + 1) / total;
      ['high', 'medium', 'med', 'low'].forEach(function(k){
        if (remaining[k] <= 0) return;
        var score = progress * pools[k] - placed[k];
        if (k === prev) score -= 1.0;
        score += order.indexOf(k) * 0.0001;
        if (score > bestScore) {
          bestScore = score;
          best = k;
        }
      });
      middleSeq.push(best);
      remaining[best]--;
      placed[best]++;
      prev = best;
    }
    
    var seq = [];
    if (firstLow) seq.push('low');
    seq = seq.concat(middleSeq);
    if (lastLow) seq.push('low');
    return seq;
  }

  function curCounts(){ var c=state.config; return { high:c.high.count, medium:c.medium.count, med:c.med.count, low:c.low.count }; }
  function computeLen(targetSec, counts){
    var R=RATIOS; var tr=counts.high*R.high+counts.medium*R.medium+counts.med*R.med+counts.low*R.low;
    if(tr===0) return {high:0,medium:0,med:0,low:0};
    var u=targetSec/tr;
    return { high:Math.max(1,Math.round(R.high*u)), medium:Math.max(1,Math.round(R.medium*u)), med:Math.max(1,Math.round(R.med*u)), low:Math.max(1,Math.round(R.low*u)) };
  }
  function minPresentLen(L, counts){ var mn=Infinity; ['high','medium','med','low'].forEach(function(k){ if(counts[k]>0) mn=Math.min(mn,L[k]); }); return mn; }
  function canAdd(k){ if(state.config[k].count>=12) return false; var counts=curCounts(); counts[k]++; var L=computeLen(state.targetMin*60,counts); return minPresentLen(L,counts)>=MINLEN; }
  function canSetTarget(targetSec){ var counts=curCounts(); var L=computeLen(targetSec,counts); return minPresentLen(L,counts)>=MINLEN; }
  function buildPreview(){ var counts=curCounts(); var L=computeLen(state.targetMin*60,counts); return arrange(counts.high,counts.medium,counts.med,counts.low).map(function(k){ return {intensity:k,len:L[k]}; }); }

  function surprise(){
    var tgt=state.targetMin*60; var kinds=['high','medium','med','low'];
    var counts={high:0,medium:0,med:0,low:2}; var guard=0;
    var want=6+Math.floor(Math.random()*6);
    while((counts.high+counts.medium+counts.med+counts.low)<want && guard<300){
      guard++;
      var k=kinds[Math.floor(Math.random()*4)];
      if(counts[k]>=12) continue;
      var test={high:counts.high,medium:counts.medium,med:counts.med,low:counts.low}; test[k]++;
      var L=computeLen(tgt,test);
      if(minPresentLen(L,test)>=MINLEN){ counts=test; } else break;
    }
    if(counts.high+counts.medium+counts.med+counts.low===0){ counts.low=2; }
    state.config.high.count=counts.high; state.config.medium.count=counts.medium; state.config.med.count=counts.med; state.config.low.count=counts.low;
    state.advancedEdited = false;
    render();
  }

  function downloadShareCard(){
    var canvas = document.createElement('canvas');
    canvas.width = 1200;
    canvas.height = 630;
    var ctx = canvas.getContext('2d');
    var totalText = fmt(state.totalDuration);
    var intervalsText = String(state.sequence.length);

    var grad = ctx.createLinearGradient(0,0,0,630);
    grad.addColorStop(0, '#f2f8fc');
    grad.addColorStop(1, '#e4eff7');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,1200,630);

    ctx.strokeStyle = '#cddbe8';
    ctx.lineWidth = 16;
    ctx.strokeRect(8, 8, 1184, 614);

    ctx.font = "bold 26px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#005B96';
    ctx.letterSpacing = "5px";
    ctx.fillText("CREWCALL", 80, 90);

    ctx.font = "500 18px 'Hanken Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#56697a';
    ctx.letterSpacing = "0px";
    ctx.fillText("Interval rowing coach", 80, 120);

    ctx.font = "bold 64px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#1c2833';
    ctx.fillText("Workout Complete!", 80, 240);

    ctx.font = "500 24px 'Hanken Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#56697a';
    ctx.fillText("Cadence held, limits pushed. Rowed like a champion.", 80, 285);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(80, 330, 240, 110, 16);
    ctx.roundRect(360, 330, 240, 110, 16);
    ctx.fill();

    ctx.font = "600 14px 'Hanken Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#7a8c9e';
    ctx.fillText("DURATION", 110, 365);
    ctx.fillText("INTERVALS", 390, 365);

    ctx.font = "bold 38px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#1c2833';
    ctx.fillText(totalText, 110, 415);
    ctx.fillText(intervalsText, 390, 415);

    var barX = 80;
    var barY = 485;
    var barWidth = 1040;
    var barHeight = 24;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barWidth, barHeight, 8);
    ctx.fill();

    var currentX = barX;
    state.sequence.forEach(function(s, idx){
      var segWidth = (s.len / state.totalDuration) * barWidth;
      var fill = COLORS[s.intensity].fill;
      ctx.fillStyle = fill;
      ctx.beginPath();
      var rLeft = idx === 0 ? 8 : 0;
      var rRight = idx === state.sequence.length - 1 ? 8 : 0;
      ctx.roundRect(currentX, barY, segWidth - 0.5, barHeight, [rLeft, rRight, rRight, rLeft]);
      ctx.fill();
      currentX += segWidth;
    });

    ctx.font = "500 16px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillStyle = '#7a8c9e';
    ctx.fillText("crewcall.squarecircletriangle.co", 80, 560);

    var link = document.createElement('a');
    link.download = 'crewcall-workout.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function build(){
    if (state.isAdvancedWorkout) {
      state.sequence = state.advancedSequence.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: s.rate
        };
      });
    } else {
      state.sequence = buildPreview();
    }
    var t=0;
    state.ends=state.sequence.map(function(s){ t+=s.len; return t; });
    state.totalDuration=t;
  }

  function ensureAudio(){ try{ if(!state.actx) state.actx=new (window.AudioContext||window.webkitAudioContext)(); if(state.actx.state==='suspended') state.actx.resume(); }catch(e){} }
  function beep(freq,dur,gain){
    dur = dur===undefined?0.12:dur; gain = gain===undefined?0.06:gain;
    if(!SOUND_ENABLED) return;
    var ctx=state.actx; if(!ctx) return;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    var t=ctx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  function transitionBeep(k){ var f = k==='high'?740 : k==='medium'?640 : k==='med'?540 : 440; beep(f,0.14,0.07); setTimeout(function(){ beep(f*1.5,0.16,0.06); },130); }
  function countBeep(){ if(!COUNTDOWN_BEEPS) return; beep(430,0.06,0.05); }
  function completeBeep(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,0.18,0.07); }, i*150); }); }

  function segIndexAt(e){ for(var i=0;i<state.ends.length;i++){ if(e<state.ends[i]) return i; } return state.ends.length-1; }
  function segStart(i){ return i===0?0:state.ends[i-1]; }

  function runWorkout(){
    build(); if(state.sequence.length===0) return;
    ensureAudio();
    state.mode='running'; state.elapsed=0; state.baseElapsed=0; state.runStart=performance.now();
    state.lastSegIndex=-1; state.lastCountTick=null;
    loop(); render();
  }
  function start(){
    state.isAdvancedWorkout = false;
    runWorkout();
  }
  function startAdvanced(){
    state.isAdvancedWorkout = true;
    runWorkout();
  }
  function loop(){ if(state.raf) cancelAnimationFrame(state.raf); state.raf=requestAnimationFrame(tick); }
  function tick(){
    if(state.mode!=='running') return;
    var now=performance.now();
    state.elapsed=state.baseElapsed+(now-state.runStart)/1000;
    if(state.elapsed>=state.totalDuration){ state.elapsed=state.totalDuration; finish(); return; }
    var idx=segIndexAt(state.elapsed);
    if(idx!==state.lastSegIndex){ state.lastSegIndex=idx; transitionBeep(state.sequence[idx].intensity); state.lastCountTick=null; }
    var remain=state.ends[idx]-state.elapsed; var rc=Math.ceil(remain);
    if(rc<=3 && rc>=1 && rc!==state.lastCountTick){ state.lastCountTick=rc; countBeep(); }
    render();
    state.raf=requestAnimationFrame(tick);
  }
  function pause(){ if(state.mode!=='running') return; state.baseElapsed=state.elapsed; state.mode='paused'; if(state.raf) cancelAnimationFrame(state.raf); render(); }
  function resume(){ if(state.mode!=='paused') return; state.runStart=performance.now(); state.mode='running'; ensureAudio(); loop(); render(); }
  function togglePause(){ state.mode==='running'?pause():resume(); }
  function skip(){
    if(state.mode!=='running'&&state.mode!=='paused') return;
    var idx=segIndexAt(state.elapsed); var ns=state.ends[idx];
    if(ns>=state.totalDuration){ finish(); return; }
    state.baseElapsed=ns+0.001; state.elapsed=state.baseElapsed; state.runStart=performance.now();
    if(state.mode==='running') loop();
    render();
  }
  function stop(){
    state.mode = state.isAdvancedWorkout ? 'advance' : 'setup';
    if(state.raf) cancelAnimationFrame(state.raf);
    state.elapsed=0;
    state.baseElapsed=0;
    render();
  }
  function finish(){ state.mode='done'; state.elapsed=state.totalDuration; if(state.raf) cancelAnimationFrame(state.raf); completeBeep(); render(); }
  function restart(){ runWorkout(); }
  function change(k,field,delta){ var c=state.config[k]; if(field==='count'){ if(delta>0 && !canAdd(k)) return; c.count=Math.max(0,Math.min(12,c.count+delta)); } state.advancedEdited = false; render(); }
  function changeTarget(delta){ var nv=state.targetMin+delta*5; if(nv<10||nv>90) return; if(delta<0 && !canSetTarget(nv*60)) return; state.targetMin=nv; state.advancedEdited = false; render(); }

  function goToAdvance() {
    state.mode = 'advance';
    if (!state.advancedSequence || state.advancedSequence.length === 0 || !state.advancedEdited) {
      var preview = buildPreview();
      state.advancedSequence = preview.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: state.config[s.intensity].rate
        };
      });
      state.advancedEdited = false;
    }
    render();
  }

  function exitAdvance() {
    state.mode = 'setup';
    render();
  }

  function resetAdvance() {
    if (confirm('Are you sure you want to reset the timeline to the current setup configuration?')) {
      var preview = buildPreview();
      state.advancedSequence = preview.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: state.config[s.intensity].rate
        };
      });
      state.advancedEdited = false;
      render();
    }
  }

  function addAdvancedBlock(intensity) {
    var defaultLens = { high: 45, medium: 90, med: 105, low: 120 };
    var len = defaultLens[intensity] || 60;
    var rate = state.config[intensity] ? state.config[intensity].rate : 24;
    state.advancedSequence.push({
      intensity: intensity,
      len: len,
      rate: rate
    });
    state.advancedEdited = true;
    render();
  }

  function deleteAdvancedBlock(idx) {
    state.advancedSequence.splice(idx, 1);
    state.advancedEdited = true;
    render();
  }

  function changeAdvancedRate(idx, delta) {
    var block = state.advancedSequence[idx];
    if (!block) return;
    block.rate = Math.max(10, Math.min(60, block.rate + delta));
    state.advancedEdited = true;
    render();
  }

  function changeAdvancedDur(idx, delta) {
    var block = state.advancedSequence[idx];
    if (!block) return;
    block.len = Math.max(MINLEN, Math.min(900, block.len + delta));
    state.advancedEdited = true;
    render();
  }

  function moveAdvancedBlock(idx, direction) {
    var seq = state.advancedSequence;
    var newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= seq.length) return;
    var temp = seq[idx];
    seq[idx] = seq[newIdx];
    seq[newIdx] = temp;
    state.advancedEdited = true;
    render();
  }

  function showToast(message) {
    var toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.remove('show');
    void toast.offsetWidth;
    toast.classList.add('show');
    if (state.toastTimeout) clearTimeout(state.toastTimeout);
    state.toastTimeout = setTimeout(function(){
      toast.classList.remove('show');
    }, 3000);
  }

  function downloadConfig(){
    var configData = {
      targetMin: state.targetMin,
      config: {
        high:   { count: state.config.high.count,   rate: state.config.high.rate },
        medium: { count: state.config.medium.count, rate: state.config.medium.rate },
        med:    { count: state.config.med.count,    rate: state.config.med.rate },
        low:    { count: state.config.low.count,    rate: state.config.low.rate }
      }
    };
    if (state.mode === 'advance' || state.isAdvancedWorkout) {
      configData.advancedSequence = state.advancedSequence;
    }
    var json = JSON.stringify(configData, null, 2);
    var blob = new Blob([json], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    
    var totalIntervals = state.mode === 'advance' || state.isAdvancedWorkout ? state.advancedSequence.length : state.config.high.count + state.config.medium.count + state.config.med.count + state.config.low.count;
    var filename = 'crewcall-' + state.targetMin + 'min-' + totalIntervals + 'intervals.json';
    
    link.download = filename;
    link.href = url;
    link.click();
    
    setTimeout(function(){
      URL.revokeObjectURL(url);
    }, 100);
    
    showToast('Configuration exported!');
  }

  function triggerUpload(){
    var input = document.getElementById('config-upload-input');
    if(input) {
      input.value = '';
      input.click();
    }
  }

  function importConfig(data){
    if (typeof data.targetMin !== 'number' || data.targetMin < 10 || data.targetMin > 90) {
      alert('Invalid session length in configuration. Target time must be between 10 and 90 minutes.');
      return;
    }

    if (data.advancedSequence && Array.isArray(data.advancedSequence)) {
      state.targetMin = data.targetMin;
      state.advancedSequence = data.advancedSequence.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: s.rate
        };
      });
      state.advancedEdited = true;
      state.mode = 'advance';
      render();
      showToast('Custom timeline loaded successfully!');
      return;
    }

    if (!data.config || typeof data.config !== 'object') {
      alert('Invalid configuration object.');
      return;
    }
    
    var keys = ['high', 'medium', 'med', 'low'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (!data.config[k] || typeof data.config[k] !== 'object') {
        alert('Missing configuration for intensity: ' + k);
        return;
      }
      var count = data.config[k].count;
      var rate = data.config[k].rate;
      if (typeof count !== 'number' || count < 0 || count > 12) {
        alert('Invalid interval count for intensity: ' + k);
        return;
      }
      if (typeof rate !== 'number' || rate < 10 || rate > 60) {
        alert('Invalid stroke rate for intensity: ' + k);
        return;
      }
    }
    
    var counts = {
      high: data.config.high.count,
      medium: data.config.medium.count,
      med: data.config.med.count,
      low: data.config.low.count
    };
    
    var targetSec = data.targetMin * 60;
    var L = computeLen(targetSec, counts);
    if (minPresentLen(L, counts) < MINLEN) {
      alert('This configuration is invalid: intervals would be shorter than ' + MINLEN + ' seconds. Try increasing target session time.');
      return;
    }
    
    state.targetMin = data.targetMin;
    keys.forEach(function(k){
      state.config[k].count = data.config[k].count;
      state.config[k].rate = data.config[k].rate;
    });

    state.advancedEdited = false;
    if (state.mode === 'advance') {
      var preview = buildPreview();
      state.advancedSequence = preview.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: state.config[s.intensity].rate
        };
      });
    }
    
    render();
    showToast('Configuration loaded successfully!');
  }

  document.addEventListener('keydown', function(e){
    if(e.code==='Space' && (state.mode==='running'||state.mode==='paused')){ e.preventDefault(); state.mode==='running'?pause():resume(); }
  });

  document.getElementById('config-upload-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var data = JSON.parse(evt.target.result);
        if (data && typeof data === 'object') {
          importConfig(data);
        } else {
          alert('Invalid file format. Please upload a valid CrewCall session configuration JSON.');
        }
      } catch(err) {
        alert('Error parsing JSON file. Please ensure it is a valid configuration file.');
      }
    };
    reader.readAsText(file);
  });

  app.addEventListener('pointerdown', function(e){
    var el = e.target.closest('[data-act]');
    if(!el) return;
    var act = el.getAttribute('data-act');
    var idx = el.getAttribute('data-idx');
    if (idx !== null) {
      idx = parseInt(idx, 10);
    }

    if (act === 'advance') {
      goToAdvance();
    } else if (act === 'exitAdvance') {
      exitAdvance();
    } else if (act === 'resetAdvance') {
      resetAdvance();
    } else if (act === 'addBlock') {
      var intensity = el.getAttribute('data-intensity');
      addAdvancedBlock(intensity);
    } else if (act === 'deleteBlock') {
      deleteAdvancedBlock(idx);
    } else if (act === 'incRate') {
      changeAdvancedRate(idx, 1);
    } else if (act === 'decRate') {
      changeAdvancedRate(idx, -1);
    } else if (act === 'incDur') {
      changeAdvancedDur(idx, 15);
    } else if (act === 'decDur') {
      changeAdvancedDur(idx, -15);
    } else if (act === 'moveUp') {
      moveAdvancedBlock(idx, -1);
    } else if (act === 'moveDown') {
      moveAdvancedBlock(idx, 1);
    } else if (act === 'startAdvanced') {
      startAdvanced();
    } else {
      var fn = ACTIONS[act];
      if(fn) fn();
    }
  });

  app.addEventListener('dragstart', function(e){
    var card = e.target.closest('.timeline-card');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.getAttribute('data-index'));
    card.classList.add('dragging');
  });

  app.addEventListener('dragover', function(e){
    var card = e.target.closest('.timeline-card');
    var dragging = app.querySelector('.dragging');
    if (!card || !dragging || card === dragging) return;

    e.preventDefault();

    var rect = card.getBoundingClientRect();
    var next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
    var parent = card.parentNode;
    parent.insertBefore(dragging, next ? card.nextSibling : card);
  });

  app.addEventListener('drop', function(e){
    e.preventDefault();
  });

  app.addEventListener('dragend', function(e){
    var dragging = app.querySelector('.dragging');
    var cards = app.querySelectorAll('.timeline-card');
    if (cards.length > 0) {
      var newSeq = [];
      cards.forEach(function(c){
        var idx = parseInt(c.getAttribute('data-index'), 10);
        if (state.advancedSequence[idx]) {
          newSeq.push(state.advancedSequence[idx]);
        }
      });
      state.advancedSequence = newSeq;
      state.advancedEdited = true;
    }
    if (dragging) {
      dragging.classList.remove('dragging');
    }
    render();
  });

  function renderVals(){
    var c=state.config, CO=COLORS;
    var isSetup=state.mode==='setup', isDone=state.mode==='done';
    var isActive=state.mode==='running'||state.mode==='paused';
    var isAdvance=state.mode==='advance';

    var prev=isAdvance ? state.advancedSequence : buildPreview();
    var pt=0; var previewSegs=prev.map(function(s){ pt+=s.len; return {flex:s.len, color:CO[s.intensity].fill}; });
    var tgt=state.targetMin*60; var counts=curCounts(); var L=computeLen(tgt,counts);
    var lenT=function(k){ return counts[k]? fmt(L[k]) : '-'; };
    var subT=function(k){ return counts[k]? counts[k]+' × '+fmt(L[k]) : 'none'; };

    var useSeq = (isSetup || isAdvance)?prev:state.sequence;
    var acc=0; var ends = (isSetup || isAdvance)? useSeq.map(function(s){acc+=s.len;return acc;}) : state.ends;
    var curIdx = isActive? segIndexAt(state.elapsed) : (isDone? useSeq.length-1 : -1);

    var segViews = useSeq.map(function(s,i){
      var co=CO[s.intensity]; var ss=i===0?0:ends[i-1];
      var status='upcoming';
      if(isDone) status='done';
      else if(isActive){ status = i<curIdx?'done' : (i===curIdx?'active':'upcoming'); }
      var segElapsed = (isActive && i===curIdx) ? Math.max(0,Math.min(s.len, state.elapsed-ss)) : (status==='done'?s.len:0);
      var pPct = Math.max(0,Math.min(100,(segElapsed/s.len)*100));
      return {
        idxText:String(i+1).padStart(2,'0'), label:co.name, durText:fmt(s.len),
        color:co.fill, ink:co.ink, tint:co.tint, flex:s.len,
        status: status,
        rowOpacity: status==='done'?0.42:1,
        rowBg: status==='active'?'oklch(1 0 0)':'transparent',
        rowBorder: status==='active'?'oklch(0.84 0.02 230)':'oklch(0.93 0.016 230)',
        phasePctText: status==='active'? pPct+'%' : '0%',
        barOpacity: status==='upcoming'?0.3:1,
      };
    });

    var phaseLabel='',phaseFill='oklch(0.965 0.004 85)',phaseInk='oklch(0.3 0.012 70)',phaseRemain='',phaseHeight='0%',phaseIdx='',nextLabel='',nextInk='',phaseStrokes='';
    if(isActive){
      var s=state.sequence[curIdx], co=CO[s.intensity];
      var remain=state.ends[curIdx]-state.elapsed; var frac=Math.max(0,Math.min(1,remain/s.len));
      var nx=state.sequence[curIdx+1];
      phaseLabel=co.name; phaseFill=co.fill; phaseInk=co.ink;
      phaseRemain=fmt(Math.ceil(remain)); phaseHeight=(frac*100)+'%';
      phaseIdx=(curIdx+1)+' / '+state.sequence.length;
      phaseStrokes=String(s.rate !== undefined ? s.rate : c[s.intensity].rate);
      nextLabel = nx?CO[nx.intensity].name:'FINISH'; nextInk = nx?CO[nx.intensity].ink:CO.low.ink;
    }

    var total = (isSetup || isAdvance)?pt:state.totalDuration;
    var overallPct = (isActive||isDone)&&total? Math.max(0,Math.min(100,(state.elapsed/total)*100)) : 0;

    return {
      isSetup:isSetup, isActive:isActive, isDone:isDone, showList:isActive||isDone, isAdvance:isAdvance,
      canStart: prev.length>0, cannotStart: prev.length===0,
      previewSegs:previewSegs, segViews:segViews,
      setupTotalText:fmt(pt), setupCount:useSeq.length,
      targetText:fmt(state.targetMin*60),
      hrate:c.high.rate, mrate:c.medium.rate, mdrate:c.med.rate, lrate:c.low.rate,
      elapsedText:fmt(state.elapsed), totalText:fmt(total),
      overallPctText: overallPct+'%',
      pauseLabel: state.mode==='paused'?'Resume':'Pause',
      phaseLabel:phaseLabel, phaseFill:phaseFill, phaseInk:phaseInk, phaseRemain:phaseRemain, phaseHeight:phaseHeight, phaseIdx:phaseIdx, nextLabel:nextLabel, nextInk:nextInk, phaseStrokes:phaseStrokes,
      hc:c.high.count, mc:c.medium.count, mdc:c.med.count, lc:c.low.count,
      hlenText:lenT('high'), mlenText:lenT('medium'), mdlenText:lenT('med'), llenText:lenT('low'),
      hsub:subT('high'), msub:subT('medium'), mdsub:subT('med'), lsub:subT('low'),
      addHDisabled: !canAdd('high'), addMDisabled: !canAdd('medium'), addMdDisabled: !canAdd('med'), addLDisabled: !canAdd('low'),
      decTargetDisabled: !(state.targetMin>10 && canSetTarget((state.targetMin-5)*60)), incTargetDisabled: !(state.targetMin<90),
    };
  }

  }

  function render(){
    var v = renderVals();
    
    var leftEl = app.querySelector('.app-left');
    var rightEl = app.querySelector('.app-right');

    if (state.mode === 'advance') {
      app.classList.add('mode-advance');
      app.style.height = 'auto';
      app.style.overflow = 'visible';
    } else {
      app.classList.remove('mode-advance');
      app.style.height = '100vh';
      app.style.overflow = 'hidden';
    }

    if (leftEl) leftEl.innerHTML = renderLeft(v);
    if (state.mode !== 'advance' && rightEl) {
      rightEl.innerHTML = renderRight(v);
    }
  }

  render();
})();
</script>
</body>
</html>
