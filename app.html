<html lang="en">
<head>

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:oklch(0.975 0.016 230);}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:oklch(0.85 0.016 230);border-radius:8px;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  button{font-family:inherit;}
  .insert-divider:hover { opacity: 0.95 !important; }

  #app {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    color: oklch(0.26 0.022 255);
    position: relative;
    z-index: 10;
  }
  .app-left {
    flex: 0 0 57%;
    position: relative;
    display: flex;
    flex-direction: column;
    border-right: 1px solid oklch(0.9 0.016 230);
    transition: flex 0.75s cubic-bezier(0.76, 0, 0.24, 1), border-color 0.75s ease;
    z-index: 20;
    overflow: visible;
  }
  .app-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: oklch(0.985 0.015 230);
    min-width: 0;
    transition: transform 0.75s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.75s ease, flex 0.75s cubic-bezier(0.76, 0, 0.24, 1);
    position: relative;
    z-index: 10;
  }
  #app.mode-advance {
    height: 100vh;
    overflow: hidden;
  }
  #app.mode-advance .app-left {
    flex: 0 0 100%;
    border-right: none;
    height: 100vh;
    overflow: hidden;
  }
  #app.sidebar-hidden .app-left {
    flex: 0 0 100%;
    border-right: none;
  }
  #app.mode-advance .app-right,
  #app.sidebar-hidden .app-right {
    flex: 0 0 0%;
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }
  .left-container {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 60px;
    background: transparent;
  }
  .active-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px 36px;
  }
  .setup-metrics-row {
    display: flex;
    align-items: flex-end;
    gap: 40px;
  }
  .setup-time-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 110px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: oklch(0.3 0.012 70);
  }
  .setup-count-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 52px;
    line-height: 1;

  }

  .btn-start{background:#005B96;}
  .btn-start:hover{background:#004a7a;}
  .btn-soft:hover{background:oklch(0.97 0.016 230);}
  .btn-danger:hover{background:oklch(0.97 0.02 27);}
  .btn-surprise:hover{background:oklch(0.97 0.025 27);}
  .btn-stepper:hover{background:oklch(0.95 0.016 230);}
  .btn-stepper-soft:hover{background:oklch(0.95 0.016 230);}
  .btn-disabled{opacity:0.3;pointer-events:none;}

  /* ---------------------------------------------------------------- */
  /* Mobile (phone) layout — one primary panel per mode, the other      */
  /* becomes a compact bar or an on-demand sheet instead of stacking.  */
  /* ---------------------------------------------------------------- */
  #mobile-topbar { display: none; }
  .mobile-sheet-scrim { display: none; }

  @media (max-width: 767px) {
    #mobile-topbar {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 16px;
      flex: 0 0 auto;
      background: oklch(0.985 0.015 230 / 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid oklch(0.9 0.016 230);
      position: relative;
      z-index: 30;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: #000000;
    }

    body { display: flex; flex-direction: column; height: 100dvh; margin: 0; overflow-x: hidden; overflow-y: hidden; }

    #app {
      flex-direction: column;
      height: auto;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .app-left {
      flex: 1 1 auto;
      width: 100%;
      border-right: none;
      min-height: 0;
      overflow-y: auto;
    }
    .app-right {
      flex: 0 0 auto;
      width: 100%;
      background: oklch(0.985 0.015 230);
    }
    #app.mode-advance .app-right {
      display: none;
    }
    .left-container {
      position: relative;
      inset: auto;
      padding: 24px 18px !important;
      gap: 22px;
      min-height: 100%;
      align-items: center;
      text-align: center;
    }
    .left-container > div {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .setup-metrics-row {
      gap: 20px;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
    }
    .setup-time-val {
      font-size: clamp(56px, 14vw, 84px);
    }
    .setup-count-val {
      font-size: clamp(32px, 8vw, 44px);
    }
    .active-inner {
      position: relative;
      inset: auto;
      padding: 20px 16px;
      gap: 24px;
      min-height: 100%;
      width: 100%;
      align-items: stretch;
    }

    /* SETUP: the builder (right panel) is the primary scrollable view;   */
    /* the summary/start button collapse into a fixed bottom action bar. */
    #app[data-mode="setup"] .app-left {
      order: 2;
      flex: 0 0 auto;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 500;
      border-top: 1px solid oklch(0.9 0.016 230);
      background: oklch(1 0 0 / 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    #app[data-mode="setup"] .app-left-content {
      position: relative !important;
      inset: auto !important;
    }
    #app[data-mode="setup"] .app-backdrop-wrapper {
      display: none;
    }
    #app[data-mode="setup"] .app-right {
      order: 1;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    #app[data-mode="setup"] .setup-builder-scroll {
      padding-bottom: 110px !important;
    }
    #app[data-mode="setup"] .left-container {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      text-align: left;
      min-height: 0;
    }
    #app[data-mode="setup"] .left-container > div {
      display: block;
      width: auto;
    }
    #app[data-mode="setup"] .setup-brand {
      display: none !important;
    }
    #app[data-mode="setup"] .setup-summary {
      flex: 1 1 auto;
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
      gap: 4px !important;
    }
    #app[data-mode="setup"] .setup-metrics-row {
      justify-content: flex-start;
      align-items: baseline;
      gap: 14px;
    }
    #app[data-mode="setup"] .setup-time-val {
      font-size: 22px;
    }
    #app[data-mode="setup"] .setup-count-val {
      font-size: 16px;
    }
    #app[data-mode="setup"] .setup-preview-bar,
    #app[data-mode="setup"] .setup-time-label,
    #app[data-mode="setup"] .setup-count-label {
      display: none !important;
    }
    #app[data-mode="setup"] .setup-metrics-row > div:last-child {
      padding-bottom: 0 !important;
    }
    #app[data-mode="setup"] .setup-cta {
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
    }
    #app[data-mode="setup"] .setup-cta button {
      padding: 12px 16px !important;
      font-size: 13px !important;
      gap: 8px !important;
      white-space: nowrap;
    }

    /* ADVANCE: cards list is primary; the control panel becomes a       */
    /* sticky bottom action bar instead of a 340px side column.          */
    #app.mode-advance .app-left {
      flex: 1 1 auto;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      padding-top: 0;
    }
    #app.mode-advance .advance-brand {
      display: none;
    }
    #app.mode-advance .advance-body {
      flex-direction: column;
      overflow: visible !important;
      gap: 16px !important;
    }
    #app.mode-advance #timeline-cards-column {
      overflow-y: visible !important;
    }
    #app.mode-advance .control-panel {
      width: 100% !important;
      max-width: 100vw;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 500;
      max-height: none !important;
      border-radius: 20px 20px 0 0 !important;
      padding: 0 16px !important;
      box-shadow: 0 -12px 30px oklch(0.3 0.022 255 / 0.18);
      overflow-x: hidden;
    }
    #app.mode-advance .control-panel .advance-actions-grid {
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 6px !important;
    }
    #app.mode-advance .control-panel .advance-actions-grid button span {
      display: none;
    }
    #app.mode-advance #timeline-cards-column,
    #app.mode-advance .left-container {
      padding-bottom: 120px !important;
    }
    .timeline-move-btn {
      display: none !important;
    }
    .timeline-card {
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .timeline-dur-btn {
      width: 32px !important;
      height: 32px !important;
    }
    .timeline-delete-btn {
      padding: 8px !important;
    }
    /* Touch-friendly: increase target sizes on mobile */
    .timeline-card [data-act],
    .timeline-card button {
      min-height: 44px;
      min-width: 44px;
    }
    .timeline-card .timeline-dur-btn {
      min-height: 44px;
      min-width: 44px;
      width: 44px !important;
      height: 44px !important;
    }

    /* PREP: brief transitional countdown - list stays in normal flow    */
    /* below it (no sheet), so shrink the huge desktop countdown so it   */
    /* doesn't push the list off-screen.                                 */
    #app[data-mode="prep"] .prep-countdown-val {
      font-size: 96px !important;
    }
    #app[data-mode="prep"] .app-left {
      flex: 0 0 auto;
    }
    #app[data-mode="prep"] .app-left-content {
      position: relative !important;
      inset: auto !important;
    }
    #app[data-mode="prep"] .app-backdrop-wrapper {
      display: none;
    }

    /* RUNNING / PAUSED / PREP / DONE: timer/controls stay primary and   */
    /* full-height; the interval list becomes an on-demand bottom sheet. */
    /* Reserve room so the floating toggle pill never covers content     */
    /* that scrolls to the bottom (e.g. the Done screen's action row).   */
    #app.has-sheet .left-container {
      padding-bottom: 90px !important;
    }
    #app[data-mode="done"] .left-container {
      justify-content: flex-start !important;
      flex-shrink: 0;
      padding-top: 32px !important;
      padding-bottom: 120px !important;
    }
    #app.has-sheet .app-right {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 900;
      max-height: 65vh;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -12px 30px oklch(0.3 0.022 255 / 0.18);
      overflow-y: auto;
      overflow-x: hidden;
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.76, 0, 0.24, 1);
      max-width: 100vw;
    }
    #app.has-sheet.sidebar-hidden .app-right {
      transform: translateY(100%);
      pointer-events: none;
    }
    #app.has-sheet .mobile-sheet-scrim {
      display: block;
      position: fixed;
      inset: 0;
      background: oklch(0.2 0.02 255 / 0.35);
      z-index: 850;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s ease;
    }
    #app.has-sheet.sidebar-hidden .mobile-sheet-scrim {
      opacity: 0;
      pointer-events: none;
    }
    #app.has-sheet .sidebar-toggle-btn {
      position: fixed;
      left: 50%;
      right: auto;
      top: auto;
      bottom: 18px;
      transform: translateX(-50%);
      width: auto;
      height: auto;
      border-radius: 30px;
      padding: 10px 20px;
      gap: 8px;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 950;
    }
    #app.has-sheet .sidebar-toggle-btn:hover,
    #app.has-sheet .sidebar-toggle-btn:active,
    #app.has-sheet.sidebar-hidden .sidebar-toggle-btn:hover,
    #app.has-sheet.sidebar-hidden .sidebar-toggle-btn:active {
      transform: translateX(-50%);
    }
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: oklch(0.26 0.022 255);
    color: oklch(0.97 0.006 85);
    padding: 12px 24px;
    border-radius: 12px;
    box-shadow: 0 10px 30px oklch(0.3 0.022 255 / 0.15);
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  @keyframes highlight-glow {
    0% {
      box-shadow: 0 0 0 0px var(--highlight-color);
      transform: scale(1);
    }
    20% {
      box-shadow: 0 0 0 6px var(--highlight-color);
      transform: scale(1.03);
    }
    100% {
      box-shadow: 0 0 0 0px var(--highlight-color);
      transform: scale(1);
    }
  }
  .card-highlighted {
    animation: highlight-glow 2s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 5;
  }
  @keyframes control-panel-enter {
    0% {
      opacity: 0;
      transform: translateX(80px);
    }
    30% {
      opacity: 0;
      transform: translateX(80px);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }
  #app.mode-advance-entering .control-panel {
    animation: control-panel-enter 0.8s cubic-bezier(0.76, 0, 0.24, 1) both;
  }
  .timeline-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .timeline-card.dragging {
    opacity: 0.4;
    border: 2px dashed oklch(0.7 0.02 230) !important;
    background: oklch(0.97 0.01 230) !important;
    transform: scale(0.98);
    transition: none;
  }
  .timeline-card.drag-over {
    border-color: oklch(0.5 0.1 230) !important;

  }
  .timeline-cards-container::-webkit-scrollbar {
    width: 6px;
  }
  .timeline-cards-container::-webkit-scrollbar-thumb {
    background: oklch(0.85 0.016 230);
    border-radius: 4px;
  }

  /* Global Water Background Backdrop */
  .water-bg-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    background: oklch(0.98 0.01 230);
  }
  .water-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.75;
    mix-blend-mode: multiply;
    animation: drift 20s infinite ease-in-out alternate;
  }
  .blob-1 {
    width: 100vw;
    height: 100vw;
    background: radial-gradient(circle, oklch(0.85 0.12 230) 0%, rgba(255,255,255,0) 70%);
    top: -20vh;
    left: -10vw;
    animation-duration: 25s;
  }
  .blob-2 {
    width: 90vw;
    height: 90vw;
    background: radial-gradient(circle, oklch(0.88 0.10 250) 0%, rgba(255,255,255,0) 70%);
    bottom: -10vh;
    right: -10vw;
    animation-duration: 30s;
    animation-delay: -5s;
  }
  .blob-3 {
    width: 80vw;
    height: 80vw;
    background: radial-gradient(circle, oklch(0.82 0.14 195) 0%, rgba(255,255,255,0) 70%);
    top: 30vh;
    left: 40vw;
    animation-duration: 22s;
    animation-delay: -10s;
  }
  .water-frosted-overlay {
    position: absolute;
    inset: 0;
    backdrop-filter: blur(60px) saturate(130%);
    background: oklch(0.975 0.016 230 / 0.45);
  }

  /* Global Video Backdrop (matching index.html) */
  .header-video-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
    /* Water-inspired gradient fallback (no video load needed on mobile data) */
    background: radial-gradient(ellipse 80% 60% at 30% 20%, oklch(0.85 0.10 230 / 0.5) 0%, transparent 80%),
                radial-gradient(ellipse 70% 50% at 80% 80%, oklch(0.82 0.14 195 / 0.4) 0%, transparent 70%),
                linear-gradient(135deg, oklch(0.92 0.05 220), oklch(0.96 0.02 240));
  }
  .header-video-bg.has-video {
    background: none;
  }
  .header-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(10px) saturate(110%);
    opacity: 0.55;
    transform: scale(1.25);
  }
  .header-video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 30%,
      oklch(0.98 0.01 230 / 0.4) 100%

  @keyframes drift {
    0% {
      transform: translate(0, 0) scale(1) rotate(0deg);
    }
    50% {
      transform: translate(10vw, 8vh) scale(1.15) rotate(180deg);
    }
    100% {
      transform: translate(-10vw, -10vh) scale(0.9) rotate(360deg);
    }
  }

  .app-backdrop-wrapper {
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #app.session-active .app-backdrop-wrapper {
    opacity: 0;
  }

  .sidebar-toggle-mount {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 950;
  }
  .sidebar-toggle-btn {
    position: absolute;
    right: 43%;
    top: 50%;
    transform: translate(50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: oklch(1 0 0);
    border: 1px solid oklch(0.9 0.016 230);
    box-shadow: 0 4px 12px oklch(0.3 0.022 255 / 0.12);
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: transform 0.3s cubic-bezier(0.76, 0, 0.24, 1), background-color 0.2s ease, border-color 0.2s ease;
    color: oklch(0.3 0.022 255);
  }
  .sidebar-toggle-btn:hover {
    background: oklch(0.975 0.016 230);
    transform: translate(50%, -50%) scale(1.08);
  }
  .sidebar-toggle-btn:active {
    transform: translate(50%, -50%) scale(0.95);
  }

  #app.sidebar-hidden .sidebar-toggle-btn {
    right: 0;
    transform: translate(-10px, -50%);
  }
  #app.sidebar-hidden .sidebar-toggle-btn:hover {
    transform: translate(-10px, -50%) scale(1.08);
  }
  #app.sidebar-hidden .sidebar-toggle-btn:active {
    transform: translate(-10px, -50%) scale(0.95);
  }
</style>

<body>
<div id="mobile-topbar">CREWCALL</div>
<div id="app">
  <div class="app-left">
    <!-- Sticky Column Background (constrained to left panel) -->
    <div class="app-backdrop-wrapper" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;">
      <div style="position: sticky; top: 0; width: 100%; height: 100vh; overflow: hidden;">
        <!-- Frosted Moving Water Backdrop -->
        <div class="water-bg-container">
          <div class="water-blob blob-1"></div>
          <div class="water-blob blob-2"></div>
          <div class="water-blob blob-3"></div>
          <div class="water-frosted-overlay"></div>
        </div>

        <!-- Header Video Backdrop — gradient shown by default; video loaded on fast connections -->
        <div class="header-video-bg" id="headerVideoBgApp">
          <div class="header-video-overlay"></div>
        </div>
      </div>
    </div>

    <div class="app-left-content" style="position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 3;"></div>
  </div>
  <div class="app-right"></div>
  <div class="mobile-sheet-scrim" data-act="toggleSidebar"></div>
  <div class="sidebar-toggle-mount"></div>
</div>
<input type="file" id="config-upload-input" accept=".json" style="display:none">

<script>
  // Lazy-load hero video on fast connections only
  (function(){
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    var isFast = !conn || conn.type === 'wifi' || conn.type === 'ethernet' ||
      (conn.effectiveType && (conn.effectiveType === '4g' || conn.effectiveType === '5g'));
    var reducedData = conn && conn.saveData === true;
    if (isFast && !reducedData) {
      var container = document.getElementById('headerVideoBgApp');
      var video = document.createElement('video');
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.className = 'header-video';
      video.innerHTML = '<source src="hero-bg.mp4" type="video/mp4">';
      container.prepend(video);
      container.classList.add('has-video');
    }
  })();
(function(){

  function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }

  function arrange(h,m,md,l,f){
    f = f || 0;
    var firstLow = false;
    var lastLow = false;
    var remL = l;

    if (remL > 0) {
      firstLow = true;
      remL--;
    }
    if (remL > 0) {
      lastLow = true;
      remL--;
    }

    var pools = { high: h, medium: m, med: md, low: remL, freeform: f };
    var total = h + m + md + remL + f;
    var remaining = { high: pools.high, medium: pools.medium, med: pools.med, low: pools.low, freeform: pools.freeform };
    var placed = { high: 0, medium: 0, med: 0, low: 0, freeform: 0 };
    var order = ['low', 'med', 'medium', 'high', 'medium', 'med', 'freeform'];
    var middleSeq = [];
    var prev = firstLow ? 'low' : null;

    for (var i = 0; i < total; i++) {
      var best = null, bestScore = -Infinity;
      var progress = (i + 1) / total;
      ['high', 'medium', 'med', 'low', 'freeform'].forEach(function(k){
        if (remaining[k] <= 0) return;
        var score = progress * pools[k] - placed[k];
        if (k === prev) score -= 1.0;
        score += order.indexOf(k) * 0.0001;
        if (score > bestScore) {
          bestScore = score;
          best = k;
        }
      });
      middleSeq.push(best);
      remaining[best]--;
      placed[best]++;
      prev = best;
    }

    var seq = [];
    if (firstLow) seq.push('low');
    seq = seq.concat(middleSeq);
    if (lastLow) seq.push('low');
    return seq;
  }

  function curCounts(){ var c=state.config; return { high:c.high.count, medium:c.medium.count, med:c.med.count, low:c.low.count, freeform:c.freeform.count }; }
  function computeLen(targetSec, counts){
    var R=RATIOS; var tr=counts.high*R.high+counts.medium*R.medium+counts.med*R.med+counts.low*R.low+counts.freeform*R.freeform;
    if(tr===0) return {high:0,medium:0,med:0,low:0,freeform:0};
    var u=targetSec/tr;
    return { high:Math.max(1,Math.round(R.high*u)), medium:Math.max(1,Math.round(R.medium*u)), med:Math.max(1,Math.round(R.med*u)), low:Math.max(1,Math.round(R.low*u)), freeform:Math.max(1,Math.round(R.freeform*u)) };
  }
  function minPresentLen(L, counts){ var mn=Infinity; ['high','medium','med','low','freeform'].forEach(function(k){ if(counts[k]>0) mn=Math.min(mn,L[k]); }); return mn; }
  function canAdd(k){ if(state.config[k].count>=12) return false; var counts=curCounts(); counts[k]++; var L=computeLen(state.targetMin*60,counts); return minPresentLen(L,counts)>=MINLEN; }
  function canSetTarget(targetSec){ var counts=curCounts(); var L=computeLen(targetSec,counts); return minPresentLen(L,counts)>=MINLEN; }
  function buildPreview(){ var counts=curCounts(); var L=computeLen(state.targetMin*60,counts); return arrange(counts.high,counts.medium,counts.med,counts.low,counts.freeform).map(function(k){ return {intensity:k,len:L[k]}; }); }

  function applyAutoBreaks(sequence) {
    if (!state.breaksEnabled || state.targetMin < 20) {
      return sequence;
    }
    var result = [];
    var activeElapsed = 0;
    var nextBreakMark = 600;
    for (var i = 0; i < sequence.length; i++) {
      var seg = sequence[i];
      var remainingLen = seg.len;
      var intensity = seg.intensity;
      var rate = seg.rate;
      
      while (remainingLen > 0) {
        var timeToNextBreak = nextBreakMark - activeElapsed;
        if (timeToNextBreak > 0 && remainingLen >= timeToNextBreak) {
          result.push({
            intensity: intensity,
            len: timeToNextBreak,
            rate: rate
          });
          activeElapsed += timeToNextBreak;
          remainingLen -= timeToNextBreak;
          if (activeElapsed < state.targetMin * 60) {
            result.push({
              intensity: 'break',
              len: 30,
              rate: 0
            });
          }
          nextBreakMark += 600;
        } else {
          result.push({
            intensity: intensity,
            len: remainingLen,
            rate: rate
          });
          activeElapsed += remainingLen;
          remainingLen = 0;
        }
      }
    }
    return result;
  }

    var counts={high:0,medium:0,med:0,low:2,freeform:0}; var guard=0;
    var want=6+Math.floor(Math.random()*6);
    while((counts.high+counts.medium+counts.med+counts.low)<want && guard<300){
      guard++;
      var k=kinds[Math.floor(Math.random()*4)];
      if(counts[k]>=12) continue;
      var test={high:counts.high,medium:counts.medium,med:counts.med,low:counts.low,freeform:counts.freeform}; test[k]++;
      var L=computeLen(tgt,test);
      if(minPresentLen(L,test)>=MINLEN){ counts=test; } else break;
    }
    if(counts.high+counts.medium+counts.med+counts.low===0){ counts.low=2; }
    state.config.high.count=counts.high; state.config.medium.count=counts.medium; state.config.med.count=counts.med; state.config.low.count=counts.low;

      } else if (energy === 'moderate') {
        if (tired === 'yes') {
          coreBlocks = [
            { intensity: 'medium', len: 90, rate: 28 },

        } else {

            { intensity: 'med', len: 120, rate: 26 }
          ];
        }
      } else { // energy === 'low'
        if (tired === 'yes') {
          coreBlocks = [
            { intensity: 'med', len: 90, rate: 26 },
            { intensity: 'low', len: 180, rate: 24 },
            { intensity: 'break', len: 30, rate: 0 },

        } else {

  function build(){
    if (state.isAdvancedWorkout) {
      state.sequence = state.advancedSequence.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: s.rate
        };
      });
    } else {
      state.sequence = applyAutoBreaks(buildPreview());
    }
    var t=0;
    state.ends=state.sequence.map(function(s){ t+=s.len; return t; });
    state.totalDuration=t;
  }

  function ensureAudio(){ try{ if(!state.actx) state.actx=new (window.AudioContext||window.webkitAudioContext)(); if(state.actx.state==='suspended') state.actx.resume(); }catch(e){} }
  function beep(freq,dur,gain){
    dur = dur===undefined?0.12:dur; gain = gain===undefined?0.06:gain;
    if(!SOUND_ENABLED) return;
    var ctx=state.actx; if(!ctx) return;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    var t=ctx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  // Schedule a beep at an absolute AudioContext time offset
  function beepAt(freq,dur,gain,offset){
    dur = dur===undefined?0.12:dur; gain = gain===undefined?0.06:gain;
    if(!SOUND_ENABLED || !state.actx) return;
    var ctx=state.actx, t=ctx.currentTime+offset;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  function transitionBeep(k){ var f = freqFor(k); beep(f,0.14,0.07); setTimeout(function(){ beep(f*1.5,0.16,0.06); },130); }
  // Schedule a transition beep at an absolute offset using AudioContext timing
  function scheduleTransition(offset,k){
    var f = freqFor(k);
    beepAt(f,0.14,0.07,offset);
    beepAt(f*1.5,0.16,0.06,offset+0.13);
  }
  function countBeep(freq){ if(!COUNTDOWN_BEEPS) return; beep(freq||430,0.06,0.05); }
  // Schedule countdown beeps at each second offset
  function scheduleCountdown(offset,freq){
    freq = freq||430; if(!COUNTDOWN_BEEPS) return;
    var ctx=state.actx; if(!ctx) return;
    for(var s=0;s<offset;s++){
      var t=ctx.currentTime+offset-s-1;
      (function(f){ beepAt(f,0.06,0.05,s?0:offset); })(freq);
    }
  }
  function completeBeep(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,0.18,0.07); }, i*150); }); }

  function segIndexAt(e){ for(var i=0;i<state.ends.length;i++){ if(e<state.ends[i]) return i; } return state.ends.length-1; }
  function segStart(i){ return i===0?0:state.ends[i-1]; }

  function runWorkout(){
    build(); if(state.sequence.length===0) return;
    ensureAudio();
    state.mode='running'; state.elapsed=0; state.baseElapsed=0; state.runStart=performance.now();
    state.lastSegIndex=-1; state.lastCountTick=null; state.nextCueIdx=0;
    state.sidebarHidden = isMobile();

    // Build audio cue timeline — pre-compute absolute cue times
    state.cueTimeline = [];
    if (SOUND_ENABLED && state.actx) {
      var seq = state.sequence;
      for (var ii = 0; ii < seq.length; ii++) {
        var segStart = state.ends[ii] - seq[ii].len;
        // Transition cue at segment start
        state.cueTimeline.push({ at: segStart, intensity: seq[ii].intensity, type: 'transition' });
        // Countdown cues in last COUNTDOWN_WINDOW seconds (before segment end)
        if (COUNTDOWN_BEEPS) {
          var cfreq = freqFor(ii+1 < seq.length ? seq[ii+1].intensity : seq[ii].intensity);
          for (var c=COUNTDOWN_WINDOW; c>=1; c--) {
            var cueAt = state.ends[ii] - c;
            if (cueAt > segStart) { // only if countdown fits within segment
              state.cueTimeline.push({ at: cueAt, freq: cfreq, type: 'countdown' });
            }
          }
        }
      }
      // Sort timeline by cue time
      state.cueTimeline.sort(function(a,b){ return a.at - b.at; });
    }

    loop(); render();
  }
  function start(){
    state.isAdvancedWorkout = false;
    beginPrep();
  }
  function startAdvanced(){
    state.isAdvancedWorkout = true;
    beginPrep();
  }
  function beginPrep(){
    build(); if(state.sequence.length===0) return;
    trackEvent('Workout Started');
    ensureAudio();
    state.mode='prep'; state.prepStart=performance.now(); state.prepElapsed=0; state.prepLastTick=null;
    state.sidebarHidden = false;
    prepLoop(); render();
  }
  function prepLoop(){ if(state.raf) cancelAnimationFrame(state.raf); state.raf=requestAnimationFrame(prepTick); }
  function prepTick(){
    if(state.mode!=='prep') return;
    var now=performance.now();
    state.prepElapsed=(now-state.prepStart)/1000;
    var remain=PREP_DURATION-state.prepElapsed;
    if(remain<=0){ runWorkout(); return; }
    var rc=Math.ceil(remain);
    if(rc!==state.prepLastTick){ state.prepLastTick=rc; countBeep(freqFor(state.sequence[0].intensity)); }
    render();
    state.raf=requestAnimationFrame(prepTick);
  }
  function loop(){ if(state.raf) cancelAnimationFrame(state.raf); state.raf=requestAnimationFrame(tick); }
  function tick(){
    if(state.mode!=='running') return;
    var now=performance.now();
    state.elapsed=state.baseElapsed+(now-state.runStart)/1000;
    if(state.elapsed>=state.totalDuration){ state.elapsed=state.totalDuration; finish(); return; }

    // Fire cues from pre-computed timeline using AudioContext scheduling
    while (state.cueTimeline && state.nextCueIdx < state.cueTimeline.length) {
      var cue = state.cueTimeline[state.nextCueIdx];
      if (cue.at > state.elapsed) break; // not yet
      if (cue.type === 'transition') {
        scheduleTransition(0, cue.intensity);
      } else if (cue.type === 'countdown') {
        beepAt(cue.freq, 0.06, 0.05, 0); // fire immediately via AudioContext currentTime
      }
      state.nextCueIdx++;
    }
    render();
    state.raf=requestAnimationFrame(tick);
  }
  function pause(){ if(state.mode!=='running') return; state.baseElapsed=state.elapsed; state.mode='paused'; if(state.raf) cancelAnimationFrame(state.raf); render(); }
  function resume(){ if(state.mode!=='paused') return; state.runStart=performance.now(); state.mode='running'; ensureAudio(); loop(); render(); }
  function togglePause(){ state.mode==='running'?pause():resume(); }

  // Ensure accurate display when tab comes back to foreground (rAF is throttled in background)
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && (state.mode==='running'||state.mode==='prep')) {
      render(); // force re-render with correct elapsed time
    }
  });
  function skip(){
    if(state.mode!=='running'&&state.mode!=='paused') return;
    var idx=segIndexAt(state.elapsed); var ns=state.ends[idx];
    if(ns>=state.totalDuration){ finish(); return; }
    state.baseElapsed=ns+0.001; state.elapsed=state.baseElapsed; state.runStart=performance.now();
    if(state.mode==='running') loop();
    render();
  }
  function stop(){
    state.mode = state.isAdvancedWorkout ? 'advance' : 'setup';
    if(state.raf) cancelAnimationFrame(state.raf);
    state.elapsed=0;
    state.baseElapsed=0;
    state.sidebarHidden = false;
    if (app) app.classList.remove('sidebar-hidden');
    render();
  }
  function finish(){ state.mode='done'; state.elapsed=state.totalDuration; if(state.raf) cancelAnimationFrame(state.raf); completeBeep(); render(); trackEvent('Workout Completed'); }
  function restart(){ beginPrep(); }
  function change(k,field,delta){ var c=state.config[k]; if(field==='count'){ if(delta>0 && !canAdd(k)) return; c.count=Math.max(0,Math.min(12,c.count+delta)); } state.advancedEdited = false; render(); }
  function changeTarget(delta){ var nv=state.targetMin+delta*5; if(nv<10||nv>90) return; if(delta<0 && !canSetTarget(nv*60)) return; state.targetMin=nv; state.advancedEdited = false; render(); }

  function addAdvancedBlock(intensity) {
    var defaultLens = { high: 45, medium: 90, med: 105, low: 120, break: 30, freeform: 90 };
    var len = defaultLens[intensity] || 60;
    var rate = intensity === 'freeform' ? null : (state.config[intensity] ? state.config[intensity].rate : 0);
    state.advancedSequence.push({
      intensity: intensity,
      len: len,
      rate: rate
    });
    state.advancedEdited = true;
    render();
  }

  function toggleInsertMenu(idx) {

    }

  }

  function closeInsertMenu() {

  }

  function insertAdvancedBlock(idx, intensity) {
    var defaultLens = { high: 45, medium: 90, med: 105, low: 120, break: 30, freeform: 90 };
    var len = defaultLens[intensity] || 60;
    var rate = intensity === 'freeform' ? null : (state.config[intensity] ? state.config[intensity].rate : 0);

    var newBlock = { intensity: intensity, len: len, rate: rate };
    state.advancedSequence.splice(idx, 0, newBlock);
    state.advancedEdited = true;
    state.insertIndex = null;
    render();
  }

  function deleteAdvancedBlock(idx) {

  }

  function changeAdvancedRate(idx, delta) {
    var block = state.advancedSequence[idx];
    if (!block || block.intensity === 'break' || block.intensity === 'freeform') return;
    block.rate = Math.max(10, Math.min(60, block.rate + delta));
    state.advancedEdited = true;
    render();
  }

  function changeAdvancedDur(idx, delta) {
    var block = state.advancedSequence[idx];
    if (!block) return;
    block.len = Math.max(MINLEN, Math.min(900, block.len + delta));

    render();
  }

  function moveAdvancedBlock(idx, direction) {

    render();

  function importConfig(data){
    if (typeof data.targetMin !== 'number' || data.targetMin < 10 || data.targetMin > 90) {
      alert('Invalid session length in configuration. Target time must be between 10 and 90 minutes.');
      return;
    }

    if (data.advancedSequence && Array.isArray(data.advancedSequence)) {
      var validIntensities = ['high', 'medium', 'med', 'low', 'break', 'freeform'];
      var seq = [];
      for (var j = 0; j < data.advancedSequence.length; j++) {
        var block = data.advancedSequence[j];
        if (!block || typeof block !== 'object') {
          alert('Invalid custom timeline: block ' + (j + 1) + ' is malformed.');
          return;
        }
        if (validIntensities.indexOf(block.intensity) === -1) {
          alert('Invalid custom timeline: unrecognized intensity in block ' + (j + 1) + '.');
          return;
        }
        if (typeof block.len !== 'number' || !isFinite(block.len) || block.len < MINLEN || block.len > 900) {
          alert('Invalid custom timeline: block ' + (j + 1) + ' has an invalid duration.');
          return;
        }
        var rate;
        if (block.intensity === 'break') {
          rate = 0;
        } else if (block.intensity === 'freeform') {
          rate = null;
        } else if (typeof block.rate !== 'number' || !isFinite(block.rate) || block.rate < 10 || block.rate > 60) {
          alert('Invalid custom timeline: block ' + (j + 1) + ' has an invalid stroke rate.');
          return;
        } else {
          rate = block.rate;
        }
        seq.push({ intensity: block.intensity, len: block.len, rate: rate });
      }

      state.targetMin = data.targetMin;
      state.advancedSequence = seq;
      state.advancedEdited = true;
      state.mode = 'advance';
      render();
      trackEvent('Config Imported');
      showToast('Custom timeline loaded successfully!');
      return;
    }

    if (!data.config || typeof data.config !== 'object') {
      alert('Invalid configuration object.');
      return;
    }
    
    var keys = ['high', 'medium', 'med', 'low', 'freeform'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (!data.config[k] || typeof data.config[k] !== 'object') {
        alert('Missing configuration for intensity: ' + k);
        return;
      }
      var count = data.config[k].count;
      var rate = data.config[k].rate;
      if (typeof count !== 'number' || count < 0 || count > 12) {
        alert('Invalid interval count for intensity: ' + k);
        return;
      }
      if (k !== 'freeform' && (typeof rate !== 'number' || rate < 10 || rate > 60)) {
        alert('Invalid stroke rate for intensity: ' + k);
        return;
      }
    }

    var counts = {
      high: data.config.high.count,
      medium: data.config.medium.count,
      med: data.config.med.count,
      low: data.config.low.count,
      freeform: data.config.freeform.count
    };
    
    var targetSec = data.targetMin * 60;
    var L = computeLen(targetSec, counts);
    if (minPresentLen(L, counts) < MINLEN) {
      alert('This configuration is invalid: intervals would be shorter than ' + MINLEN + ' seconds. Try increasing target session time.');
      return;
    }
    
    state.targetMin = data.targetMin;
    keys.forEach(function(k){
      state.config[k].count = data.config[k].count;
      state.config[k].rate = data.config[k].rate;
    });

    state.advancedEdited = false;
    if (state.mode === 'advance') {
      var preview = applyAutoBreaks(buildPreview());
      state.advancedSequence = preview.map(function(s){
        return {
          intensity: s.intensity,
          len: s.len,
          rate: state.config[s.intensity] ? state.config[s.intensity].rate : (s.rate || 0)
        };
      });
    }
    
    render();
    trackEvent('Config Imported');
    showToast('Configuration loaded successfully!');
  }

    incMc: function(){ change('medium','count',1); }, decMc: function(){ change('medium','count',-1); },
    incMdc: function(){ change('med','count',1); }, decMdc: function(){ change('med','count',-1); },

  app.addEventListener('pointerdown', function(e){

  // ── Timeline drag: pointer-event-based (works on touch + mouse) ──────────
  var dragState = null; // { card, startIdx, startY, offsetY, mode:'hold'/'drag' }

  app.addEventListener('pointerdown', function(pe){
    if (pe.button !== 0) return; // primary button only
    // Only initiate from drag handle or long-press via touch
    // Check: is this a drag handle?
    if (!pe.target.closest || !pe.target.closest('.drag-handle')) return;
    if (!pe.target.closest('.timeline-card')) return;

    var card = pe.target.closest('.timeline-card');
    card.setPointerCapture(pe.pointerId);
    dragState = {
      card: card,
      startIdx: parseInt(card.getAttribute('data-index'), 10),
      startY: pe.clientY,
      lastClientY: pe.clientY,
      moved: false,
      mode: 'detecting' // will switch to 'drag' after threshold
    };
    card.classList.add('dragging');
  });

  app.addEventListener('pointermove', function(pe){
    if (!dragState) return;
    var dy = pe.clientY - dragState.startY;

    // Threshold of 8px to distinguish tap from drag
    if (!dragState.moved && Math.abs(dy) < 8) return;

    dragState.moved = true;
    dragState.lastClientY = pe.clientY;

    // Reorder: find the card below pointer
    var cards = app.querySelectorAll('.timeline-card:not(.dragging)');
    var parent = dragState.card.parentNode;
    var replaced = false;

    cards.forEach(function(c){
      if (replaced) return;
      var r = c.getBoundingClientRect();
      var mid = r.top + r.height / 2;
      if (pe.clientY <= mid && r.top >= 0) {
        parent.insertBefore(dragState.card, c);
        replaced = true;
      }
    });

    if (!replaced) {
      // Append to end if pointer below last card
      var lastCard = cards[cards.length - 1];
      if (lastCard) {
        var lastRect = lastCard.getBoundingClientRect();
        if (pe.clientY > lastRect.bottom) {
          parent.appendChild(dragState.card);
        }
      }
    }

    // Highlight the drop zone
    app.querySelectorAll('.timeline-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
    var target = pe.target.closest('.timeline-card');
    if (target && target !== dragState.card) target.classList.add('drag-over');
  });

  app.addEventListener('pointerup', function(pe){
    if (!dragState) return;

    // If it was a true drag (moved beyond threshold), commit the reorder
    if (dragState.moved) {
      var cards = app.querySelectorAll('.timeline-card');
      var newSeq = [];
      cards.forEach(function(c){
        var idx = parseInt(c.getAttribute('data-index'), 10);
        if (state.advancedSequence[idx]) {
          newSeq.push(state.advancedSequence[idx]);
        }
      });
      state.advancedSequence = newSeq;
      state.advancedEdited = true;
      render();
    }

    // Clean up
    dragState.card.classList.remove('dragging');
    app.querySelectorAll('.timeline-card.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
    dragState = null;
  });

  // ── Swipe-to-delete on touch ──────────────────────────────────────────────
  var swipeState = null;

  app.addEventListener('touchstart', function(te){
    var card = te.target.closest('.timeline-card');
    if (!card) return;
    // Don't intercept if the touch is on a button or the drag handle
    if (te.target.closest('button') || te.target.closest('.drag-handle')) return;
    var touch = te.changedTouches[0];
    swipeState = {
      card: card,
      startX: touch.clientX,
      startY: touch.clientY,
      startTime: Date.now()
    };
  }, { passive: true });

  app.addEventListener('touchmove', function(te){
    if (!swipeState) return;
    var touch = te.changedTouches[0];
    var dx = touch.clientX - swipeState.startX;
    var dy = touch.clientY - swipeState.startY;
    // Only horizontal swipe, not vertical scroll
    if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 60) {
      var idx = parseInt(swipeState.card.getAttribute('data-index'), 10);
      if (!isNaN(idx)) {
        // Visual feedback
        swipeState.card.style.transform = 'translateX(' + dx + 'px)';
        swipeState.card.style.opacity = Math.max(0, 1 - Math.abs(dx) / 200);
        if (dx < -80) {
          swipeState.card.style.borderColor = 'oklch(0.6 0.1 27 / 0.4)';
        }
        swipeState.dx = dx;
      }
    }
  }, { passive: true });

  app.addEventListener('touchend', function(te){
    if (!swipeState) return;
    var dx = swipeState.dx || 0;
    var card = swipeState.card;
    var idx = parseInt(card.getAttribute('data-index'), 10);

    // Remove transform when done
    card.style.transform = '';
    card.style.opacity = '';

    // Commit delete if swiped left > 80px
    if (dx < -80 && !isNaN(idx)) {
      deleteAdvancedBlock(idx);
    }
    swipeState = null;
  }, { passive: true });

  function jumpToAdvancedBlock(idx) {

    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });

        c.classList.remove('card-highlighted');
        c.style.removeProperty('--highlight-color');
      });

        card.style.removeProperty('--highlight-color');
      }, 2000);
    }
  }

  function esc(s){ return String(s); }

  function renderVals(){
    var c=state.config, CO=COLORS;
    var isSetup=state.mode==='setup', isDone=state.mode==='done';
    var isActive=state.mode==='running'||state.mode==='paused';
    var isAdvance=state.mode==='advance';
    var isPrep=state.mode==='prep';

    var prev=isAdvance ? state.advancedSequence : applyAutoBreaks(buildPreview());
    var pt=0; var previewSegs=prev.map(function(s){ pt+=s.len; return {flex:s.len, color:CO[s.intensity].fill}; });
    var tgt=state.targetMin*60; var counts=curCounts(); var L=computeLen(tgt,counts);
    var lenT=function(k){ return counts[k]? fmt(L[k]) : '-'; };
    var subT=function(k){ return counts[k]? counts[k]+' × '+fmt(L[k]) : 'none'; };

    var useSeq = (isSetup || isAdvance)?prev:state.sequence;
    var acc=0; var ends = (isSetup || isAdvance)? useSeq.map(function(s){acc+=s.len;return acc;}) : state.ends;
    var curIdx = isActive? segIndexAt(state.elapsed) : (isDone? useSeq.length-1 : -1);

    var segViews = useSeq.map(function(s,i){
      var co=CO[s.intensity]; var ss=i===0?0:ends[i-1];
      var status='upcoming';
      if(isDone) status='done';

        var durHtml = durs.map(function(d){
          var isSel = parseInt(answers.duration, 10) === d;
          return '<button data-act="setBuilderAnswer" data-key="duration" data-val="'+d+'" style="flex:1;cursor:pointer;border-radius:10px;padding:10px;font-family:\'Space Grotesk\';font-size:15px;font-weight:600;text-align:center;transition:all 0.2s;'+
            (isSel ? 
              'background:oklch(0.3 0.012 70);color:oklch(1 0 0);border:1px solid oklch(0.3 0.012 70);' : 
              'background:oklch(1 0 0);color:oklch(0.4 0.012 70);border:1px solid oklch(0.9 0.006 85);')+'">'+
            d+'m'+
          '</button>';
        }).join('');

        contentHtml = ''+
        '<div>'+
          '<div style="font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.45 0.012 70);margin-bottom:14px;">3. Goal & Duration</div>'+
          '<div style="font-size:16px;font-weight:600;color:oklch(0.3 0.012 70);margin-bottom:12px;line-height:1.4;">What is your focus and target time?</div>'+
          '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">'+
            '<button data-act="setBuilderAnswer" data-key="goal" data-val="sweat" style="text-align:left;cursor:pointer;border-radius:12px;padding:12px 14px;transition:all 0.2s;display:flex;align-items:center;gap:12px;'+
              (answers.goal === 'sweat' ? 
                'background:oklch(0.93 0.05 27);border:2px solid oklch(0.71 0.145 27);' : 
                'background:oklch(1 0 0);border:1px solid oklch(0.9 0.006 85);')+'">'+
              '<span style="font-size:22px;flex-shrink:0;">🥵</span>'+
              '<div>'+
                '<div style="font-size:14px;font-weight:700;color:oklch(0.45 0.15 27);">Hard Sweat</div>'+
                '<div style="font-size:12px;color:oklch(0.55 0.012 70);margin-top:1px;">Heavy on Extreme & Hard efforts.</div>'+
              '</div>'+
            '</button>'+
            '<button data-act="setBuilderAnswer" data-key="goal" data-val="balanced" style="text-align:left;cursor:pointer;border-radius:12px;padding:12px 14px;transition:all 0.2s;display:flex;align-items:center;gap:12px;'+
              (answers.goal === 'balanced' ? 
                'background:oklch(0.93 0.05 190);border:2px solid oklch(0.78 0.09 190);' : 
                'background:oklch(1 0 0);border:1px solid oklch(0.9 0.006 85);')+'">'+
              '<span style="font-size:22px;flex-shrink:0;">🌀</span>'+
              '<div>'+
                '<div style="font-size:14px;font-weight:700;color:oklch(0.48 0.09 190);">Balanced Pyramid</div>'+
                '<div style="font-size:12px;color:oklch(0.55 0.012 70);margin-top:1px;">Smooth build-up and cool-down waves.</div>'+
              '</div>'+
            '</button>'+
            '<button data-act="setBuilderAnswer" data-key="goal" data-val="recovery" style="text-align:left;cursor:pointer;border-radius:12px;padding:12px 14px;transition:all 0.2s;display:flex;align-items:center;gap:12px;'+
              (answers.goal === 'recovery' ? 
                'background:oklch(0.93 0.05 158);border:2px solid oklch(0.80 0.095 158);' : 
                'background:oklch(1 0 0);border:1px solid oklch(0.9 0.006 85);')+'">'+
              '<span style="font-size:22px;flex-shrink:0;">🌊</span>'+
              '<div>'+
                '<div style="font-size:14px;font-weight:700;color:oklch(0.46 0.09 160);">Steady Endurance</div>'+
                '<div style="font-size:12px;color:oklch(0.55 0.012 70);margin-top:1px;">Consistent pacing focused on aerobic base.</div>'+
              '</div>'+
            '</button>'+
          '</div>'+
          '<div style="font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.5 0.012 70);margin-bottom:8px;">Target Workout Duration</div>'+
          '<div style="display:flex;gap:8px;">'+
            durHtml+
          '</div>'+
        '</div>';
      }

      var pct = Math.round(((step + 1) / 3) * 100);

      return ''+
      '<div style="display:flex;flex-direction:column;height:100%;padding:28px 24px;box-sizing:border-box;">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'+
          '<div>'+
            '<div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:oklch(0.58 0.012 70);font-weight:600;">Smart Session Builder</div>'+
            '<div style="font-size:22px;font-weight:700;color:oklch(0.3 0.012 70);margin-top:4px;letter-spacing:-0.01em;">Tailor your row</div>'+
          '</div>'+
          '<button data-act="closeBuilder" style="background:none;border:none;font-size:26px;cursor:pointer;color:oklch(0.5 0.012 70);padding:4px;line-height:1;">&times;</button>'+
        '</div>'+
        '<div style="margin-bottom:24px;">'+
          '<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;font-weight:600;color:oklch(0.5 0.012 70);">'+
            '<span>Step '+(step + 1)+' of 3</span>'+
            '<span style="font-family:\'Space Grotesk\';">'+pct+'%</span>'+
          '</div>'+
          '<div style="height:4px;background:oklch(0.93 0.012 85);border-radius:2px;overflow:hidden;">'+
            '<div style="height:100%;width:'+pct+'%;background:oklch(0.78 0.09 190);transition:width 0.3s ease;"></div>'+
          '</div>'+
        '</div>'+
        '<div style="flex:1;overflow-y:auto;padding-right:2px;animation:fadeIn 0.25s ease;">'+
          contentHtml+
        '</div>'+
        '<div style="display:flex;gap:12px;margin-top:20px;border-top:1px solid oklch(0.95 0.012 85);padding-top:16px;">'+
          (step > 0 ? 
            '<button data-act="prevBuilderStep" class="btn-soft" style="flex:1;cursor:pointer;border:1px solid oklch(0.87 0.012 85);background:oklch(1 0 0);color:oklch(0.35 0.012 70);padding:14px;border-radius:12px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;">Back</button>' 
            : ''
          )+
          '<button data-act="nextBuilderStep" class="btn-start" style="flex:2;cursor:pointer;border:none;color:oklch(0.97 0.006 85);padding:14px;border-radius:12px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;justify-content:center;gap:8px;">'+
            (step === 2 ? 'Generate Plan ✨' : 'Continue &rarr;')+
          '</button>'+
        '</div>'+
      '</div>';
    }

    if(v.isSetup){
      return ''+
      '<div class="setup-builder-scroll" style="display:flex;flex-direction:column;height:100%;padding:28px 24px;overflow-y:auto;">'+
        '<div style="display:flex;flex-direction:column;gap:16px;">'+
          '<div>'+
            '<div style="font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.58 0.012 70);">Build your session</div>'+
            '<div style="font-size:24px;font-weight:600;color:oklch(0.3 0.012 70);margin-top:8px;letter-spacing:-0.01em;">Set the time, stack the work.</div>'+
          '</div>'+
          '<div style="display:flex;flex-direction:column;gap:10px;">'+
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
              '<button data-act="surprise" class="btn-surprise" style="cursor:pointer;border:1px solid oklch(0.8 0.05 27);background:oklch(1 0 0);color:oklch(0.48 0.13 27);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;letter-spacing:0.03em;display:flex;align-items:center;gap:8px;white-space:nowrap;">'+
                '<span style="width:7px;height:7px;border-radius:50%;background:oklch(0.71 0.145 27);"></span>Surprise me'+
              '</button>'+
              '<button data-act="openBuilder" class="btn-soft" style="cursor:pointer;border:1px solid oklch(0.78 0.09 190);background:oklch(0.96 0.03 190);color:oklch(0.35 0.09 190);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;">'+
                '<span>✨</span>Smart Builder'+
              '</button>'+
              '<button data-act="advance" class="btn-soft" style="cursor:pointer;border:1px solid oklch(0.87 0.012 85);background:oklch(1 0 0);color:oklch(0.35 0.012 70);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;">'+
                '<span>⚡</span>Advance'+
              '</button>'+
            '</div>'+
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
              '<button data-act="uploadConfigBtn" class="btn-soft" style="cursor:pointer;border:1px solid oklch(0.87 0.012 85);background:oklch(1 0 0);color:oklch(0.35 0.012 70);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;">'+
                '<span>📂</span>Import plan'+
              '</button>'+
              '<button data-act="downloadConfig" class="btn-soft" style="cursor:pointer;border:1px solid oklch(0.87 0.012 85);background:oklch(1 0 0);color:oklch(0.35 0.012 70);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;">'+
                '<span>💾</span>Export plan'+
              '</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">'+
          '<div style="border:1px solid oklch(0.87 0.012 85);border-radius:14px;padding:12px 18px;background:oklch(0.965 0.012 85);display:flex;align-items:center;justify-content:space-between;gap:18px;">'+
            '<div>'+
              '<div style="font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.4 0.012 70);">Session length</div>'+
            '</div>'+
            '<div style="display:flex;align-items:center;gap:14px;">'+
              stepperBtn('decTarget', v.decTargetDisabled, false, '−')+
              '<span style="font-family:\'Space Grotesk\';font-size:30px;font-weight:500;min-width:78px;text-align:center;font-variant-numeric:tabular-nums;color:oklch(0.3 0.012 70);">'+v.targetText+'</span>'+
              stepperBtn('incTarget', v.incTargetDisabled, false, '+')+
            '</div>'+
          '</div>'+
          (state.targetMin >= 20 ?
            '<div style="border:1px solid oklch(0.87 0.012 85);border-radius:14px;padding:12px 18px;background:oklch(1 0 0);display:flex;align-items:center;justify-content:space-between;gap:18px;animation:fadeIn 0.3s ease;">'+
              '<div>'+
                '<div style="font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.4 0.012 70);">Auto breaks</div>'+
                '<div style="font-size:13px;color:oklch(0.6 0.012 70);margin-top:4px;">30s break after every 10 mins</div>'+
              '</div>'+
              '<button data-act="toggleBreaks" style="cursor:pointer;border:none;background:'+(state.breaksEnabled ? 'oklch(0.80 0.095 158)' : 'oklch(0.9 0.012 85)')+';padding:8px 16px;border-radius:12px;font-size:13px;font-weight:700;color:'+(state.breaksEnabled ? 'oklch(0.98 0.01 158)' : 'oklch(0.4 0.012 70)')+';transition:background 0.2s, color 0.2s;text-transform:uppercase;letter-spacing:0.05em;">'+
                (state.breaksEnabled ? 'On' : 'Off')+
              '</button>'+
            '</div>'
          : '')+
          intensityCard('Extreme','oklch(0.71 0.145 27)','oklch(0.45 0.15 27)','oklch(0.93 0.05 27)',v.hrate+' strokes',v.hc,v.hsub,'decHc','incHc',v.addHDisabled,v.hlenText)+
          intensityCard('Hard','oklch(0.83 0.12 82)','oklch(0.52 0.12 70)','oklch(0.93 0.06 82)',v.mrate+' strokes',v.mc,v.msub,'decMc','incMc',v.addMDisabled,v.mlenText)+
          intensityCard('Medium','oklch(0.78 0.09 190)','oklch(0.48 0.09 190)','oklch(0.93 0.05 190)',v.mdrate+' strokes',v.mdc,v.mdsub,'decMdc','incMdc',v.addMdDisabled,v.mdlenText)+
          intensityCard('Low','oklch(0.80 0.095 158)','oklch(0.46 0.09 160)','oklch(0.93 0.05 158)',v.lrate+' strokes',v.lc,v.lsub,'decLc','incLc',v.addLDisabled,v.llenText)+
          intensityCard('Freeform','oklch(0.74 0.13 310)','oklch(0.48 0.13 310)','oklch(0.93 0.05 310)','your own pace',v.fc,v.fsub,'decFc','incFc',v.addFDisabled,v.flenText)+
        '</div>'+
      '</div>';
    }
    if(v.showList){
      return ''+
      '<div style="display:flex;flex-direction:column;height:100%;">'+
        '<div style="padding:24px 24px 16px;border-bottom:1px solid oklch(0.91 0.006 85);">'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;">'+
            '<div style="font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.58 0.012 70);">Session plan</div>'+
            '<div style="font-family:\'Space Grotesk\';font-size:15px;font-variant-numeric:tabular-nums;color:oklch(0.5 0.012 70);">'+v.overallPctRoundedText+'</div>'+
          '</div>'+
        '</div>'+
        '<div style="flex:1;overflow-y:auto;padding:12px 18px 20px;display:flex;flex-direction:column;gap:6px;">'+
          v.segViews.map(function(seg){
            return '<div style="position:relative;display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:10px;background:'+seg.rowBg+';border:1px solid '+seg.rowBorder+';opacity:'+seg.rowOpacity+';overflow:hidden;">'+
              '<div style="position:absolute;left:0;top:0;bottom:0;width:'+seg.phasePctText+';background:'+seg.tint+';opacity:0.6;"></div>'+
              '<span style="position:relative;width:11px;height:11px;border-radius:50%;background:'+seg.color+';flex:0 0 auto;"></span>'+
              '<span style="position:relative;font-family:\'Space Grotesk\';font-size:14px;color:oklch(0.6 0.012 70);min-width:22px;font-variant-numeric:tabular-nums;">'+seg.idxText+'</span>'+
              '<span style="position:relative;font-size:15px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:'+seg.ink+';">'+seg.label+'</span>'+
              '<span style="position:relative;margin-left:auto;font-family:\'Space Grotesk\';font-size:16px;font-variant-numeric:tabular-nums;color:oklch(0.4 0.012 70);">'+seg.durText+'</span>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>';
    }
    return '';
  }

  function render(){
    var v = renderVals();
    
    var leftEl = app.querySelector('.app-left');
    var rightEl = app.querySelector('.app-right');

    var cardsCol = app.querySelector('#timeline-cards-column');
    var scrollTop = cardsCol ? cardsCol.scrollTop : 0;

    app.setAttribute('data-mode', state.mode);

    if (state.mode !== 'setup') {
      app.classList.add('session-active');
    } else {
      app.classList.remove('session-active');
    }

    if (state.mode === 'advance') {
      app.classList.add('mode-advance');
      if (state.enteringAdvance) {
        app.classList.add('mode-advance-entering');
      }
    } else {
      app.classList.remove('mode-advance');
      app.classList.remove('mode-advance-entering');
    }
    app.style.height = '';
    app.style.overflow = '';

    var sheetMode = state.mode === 'running' || state.mode === 'paused' || state.mode === 'done';
    app.classList.toggle('has-sheet', sheetMode);

    if (state.sidebarHidden && sheetMode) {
      app.classList.add('sidebar-hidden');
    } else {
      app.classList.remove('sidebar-hidden');
    }

    if (leftEl) {
      var leftContentEl = leftEl.querySelector('.app-left-content');
      if (leftContentEl) {
        leftContentEl.innerHTML = renderLeft(v);
      } else {
        leftEl.innerHTML = renderLeft(v);
      }
    }
    if (state.mode !== 'advance' && rightEl) {
      rightEl.innerHTML = renderRight(v);
    }

    var toggleMountEl = app.querySelector('.sidebar-toggle-mount');
    if (toggleMountEl) {
      toggleMountEl.innerHTML = sheetMode ? sidebarToggleBtn() : '';
    }

    if (cardsCol) {
      var newCardsCol = app.querySelector('#timeline-cards-column');
      if (newCardsCol) {
        newCardsCol.scrollTop = scrollTop;
      }
    }
  }

  render();
})();
</script>
</body>
</html>
