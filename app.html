<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewCall - Interval Rowing Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/crewcall.css">
<!-- Fathom - beautiful, simple website analytics -->
<script src="https://cdn.usefathom.com/script.js" data-spa="auto" data-site="NEWIECTT" defer></script>
<!-- / Fathom -->
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:oklch(0.975 0.016 230);}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:oklch(0.85 0.016 230);border-radius:8px;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  button{font-family:inherit;}
  .insert-divider:hover { opacity: 0.95 !important; }

  #app {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    color: oklch(0.26 0.022 255);
    position: relative;
    z-index: 10;
  }
  .app-left {
    flex: 0 0 57%;
    position: relative;
    display: flex;
    flex-direction: column;
    border-right: 1px solid oklch(0.9 0.016 230);
    transition: flex 0.75s cubic-bezier(0.76, 0, 0.24, 1), border-color 0.75s ease;
    z-index: 20;
    overflow: visible;
  }
  .app-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: oklch(0.985 0.015 230);
    min-width: 0;
    transition: transform 0.75s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.75s ease, flex 0.75s cubic-bezier(0.76, 0, 0.24, 1);
    position: relative;
    z-index: 10;
  }
  #app.mode-advance {
    height: 100vh;
    overflow: hidden;
  }
  #app.mode-advance .app-left {
    flex: 0 0 100%;
    border-right: none;
    height: 100vh;
    overflow: hidden;
  }
  #app.sidebar-hidden .app-left {
    flex: 0 0 100%;
    border-right: none;
  }
  #app.mode-advance .app-right,
  #app.sidebar-hidden .app-right {
    flex: 0 0 0%;
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }
  .left-container {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 60px;
    background: transparent;
  }
  .active-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px 36px;
  }
  .setup-metrics-row {
    display: flex;
    align-items: flex-end;
    gap: 40px;
  }
  .setup-time-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 110px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: oklch(0.3 0.012 70);
  }
  .setup-count-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 52px;
    line-height: 1;
    color: oklch(0.42 0.012 70);
  }

  .btn-start{background:#005B96;}
  .btn-start:hover{background:#004a7a;}
  .btn-soft:hover{background:oklch(0.97 0.016 230);}
  .btn-danger:hover{background:oklch(0.97 0.02 27);}
  .btn-surprise:hover{background:oklch(0.97 0.025 27);}
  .btn-stepper:hover{background:oklch(0.95 0.016 230);}
  .btn-stepper-soft:hover{background:oklch(0.95 0.016 230);}
  .btn-disabled{opacity:0.3;pointer-events:none;}

  /* ---------------------------------------------------------------- */
  /* Mobile (phone) layout — one primary panel per mode, the other      */
  /* becomes a compact bar or an on-demand sheet instead of stacking.  */
  /* ---------------------------------------------------------------- */
  #mobile-topbar { display: none; }
  .mobile-sheet-scrim { display: none; }

  @media (max-width: 767px) {
    #mobile-topbar {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 16px;
      flex: 0 0 auto;
      background: oklch(0.985 0.015 230 / 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid oklch(0.9 0.016 230);
      position: relative;
      z-index: 30;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: #000000;
    }

    body { display: flex; flex-direction: column; height: 100dvh; margin: 0; overflow-x: hidden; overflow-y: hidden; }

    #app {
      flex-direction: column;
      height: auto;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .app-left {
      flex: 1 1 auto;
      width: 100%;
      border-right: none;
      min-height: 0;
      overflow-y: auto;
    }
    .app-right {
      flex: 0 0 auto;
      width: 100%;
      background: oklch(0.985 0.015 230);
    }
    #app.mode-advance .app-right {
      display: none;
    }
    .left-container {
      position: relative;
      inset: auto;
      padding: 24px 18px !important;
      gap: 22px;
      min-height: 100%;
      align-items: center;
      text-align: center;
    }
    .left-container > div {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .setup-metrics-row {
      gap: 20px;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
    }
    .setup-time-val {
      font-size: clamp(56px, 14vw, 84px);
    }
    .setup-count-val {
      font-size: clamp(32px, 8vw, 44px);
    }
    .active-inner {
      position: relative;
      inset: auto;
      padding: 20px 16px;
      gap: 24px;
      min-height: 100%;
      width: 100%;
      align-items: stretch;
    }

    /* SETUP: the builder (right panel) is the primary scrollable view;   */
    /* the summary/start button collapse into a fixed bottom action bar. */
    #app[data-mode="setup"] .app-left {
      order: 2;
      flex: 0 0 auto;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 500;
      border-top: 1px solid oklch(0.9 0.016 230);
      background: oklch(1 0 0 / 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    #app[data-mode="setup"] .app-left-content {
      position: relative !important;
      inset: auto !important;
    }
    #app[data-mode="setup"] .app-backdrop-wrapper {
      display: none;
    }
    #app[data-mode="setup"] .app-right {
      order: 1;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    #app[data-mode="setup"] .setup-builder-scroll {
      padding-bottom: 110px !important;
    }
    #app[data-mode="setup"] .left-container {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      text-align: left;
      min-height: 0;
    }
    #app[data-mode="setup"] .left-container > div {
      display: block;
      width: auto;
    }
    #app[data-mode="setup"] .setup-brand {
      display: none !important;
    }
    #app[data-mode="setup"] .setup-summary {
      flex: 1 1 auto;
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
      gap: 4px !important;
    }
    #app[data-mode="setup"] .setup-metrics-row {
      justify-content: flex-start;
      align-items: baseline;
      gap: 14px;
    }
    #app[data-mode="setup"] .setup-time-val {
      font-size: 22px;
    }
    #app[data-mode="setup"] .setup-count-val {
      font-size: 16px;
    }
    #app[data-mode="setup"] .setup-preview-bar,
    #app[data-mode="setup"] .setup-time-label,
    #app[data-mode="setup"] .setup-count-label {
      display: none !important;
    }
    #app[data-mode="setup"] .setup-metrics-row > div:last-child {
      padding-bottom: 0 !important;
    }
    #app[data-mode="setup"] .setup-cta {
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
    }
    #app[data-mode="setup"] .setup-cta button {
      padding: 12px 16px !important;
      font-size: 13px !important;
      gap: 8px !important;
      white-space: nowrap;
    }

    /* ADVANCE: cards list is primary; the control panel becomes a       */
    /* sticky bottom action bar instead of a 340px side column.          */
    #app.mode-advance .app-left {
      flex: 1 1 auto;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      padding-top: 0;
    }
    #app.mode-advance .advance-brand {
      display: none;
    }
    #app.mode-advance .advance-body {
      flex-direction: column;
      overflow: visible !important;
      gap: 16px !important;
    }
    #app.mode-advance #timeline-cards-column {
      overflow-y: visible !important;
    }
    #app.mode-advance .control-panel {
      width: 100% !important;
      max-width: 100vw;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 500;
      max-height: none !important;
      border-radius: 20px 20px 0 0 !important;
      padding: 0 16px !important;
      box-shadow: 0 -12px 30px oklch(0.3 0.022 255 / 0.18);
      overflow-x: hidden;
    }
    #app.mode-advance .control-panel .advance-actions-grid {
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 6px !important;
    }
    #app.mode-advance .control-panel .advance-actions-grid button span {
      display: none;
    }
    #app.mode-advance #timeline-cards-column,
    #app.mode-advance .left-container {
      padding-bottom: 120px !important;
    }
    .timeline-move-btn {
      display: none !important;
    }
    .timeline-card {
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .timeline-dur-btn {
      width: 32px !important;
      height: 32px !important;
    }
    .timeline-delete-btn {
      padding: 8px !important;
    }
    /* Touch-friendly: increase target sizes on mobile */
    .timeline-card [data-act],
    .timeline-card button {
      min-height: 44px;
      min-width: 44px;
    }
    .timeline-card .timeline-dur-btn {
      min-height: 44px;
      min-width: 44px;
      width: 44px !important;
      height: 44px !important;
    }

    /* PREP: brief transitional countdown - list stays in normal flow    */
    /* below it (no sheet), so shrink the huge desktop countdown so it   */
    /* doesn't push the list off-screen.                                 */
    #app[data-mode="prep"] .prep-countdown-val {
      font-size: 96px !important;
    }
    #app[data-mode="prep"] .app-left {
      flex: 0 0 auto;
    }
    #app[data-mode="prep"] .app-left-content {
      position: relative !important;
      inset: auto !important;
    }
    #app[data-mode="prep"] .app-backdrop-wrapper {
      display: none;
    }

    /* RUNNING / PAUSED / PREP / DONE: timer/controls stay primary and   */
    /* full-height; the interval list becomes an on-demand bottom sheet. */
    /* Reserve room so the floating toggle pill never covers content     */
    /* that scrolls to the bottom (e.g. the Done screen's action row).   */
    #app.has-sheet .left-container {
      padding-bottom: 90px !important;
    }
    #app[data-mode="done"] .left-container {
      justify-content: flex-start !important;
      flex-shrink: 0;
      padding-top: 32px !important;
      padding-bottom: 120px !important;
    }
    #app.has-sheet .app-right {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 900;
      max-height: 65vh;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -12px 30px oklch(0.3 0.022 255 / 0.18);
      overflow-y: auto;
      overflow-x: hidden;
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.76, 0, 0.24, 1);
      max-width: 100vw;
    }
    #app.has-sheet.sidebar-hidden .app-right {
      transform: translateY(100%);
      pointer-events: none;
    }
    #app.has-sheet .mobile-sheet-scrim {
      display: block;
      position: fixed;
      inset: 0;
      background: oklch(0.2 0.02 255 / 0.35);
      z-index: 850;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.35s ease;
    }
    #app.has-sheet.sidebar-hidden .mobile-sheet-scrim {
      opacity: 0;
      pointer-events: none;
    }
    #app.has-sheet .sidebar-toggle-btn {
      position: fixed;
      left: 50%;
      right: auto;
      top: auto;
      bottom: 18px;
      transform: translateX(-50%);
      width: auto;
      height: auto;
      border-radius: 30px;
      padding: 10px 20px;
      gap: 8px;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 950;
    }
    #app.has-sheet .sidebar-toggle-btn:hover,
    #app.has-sheet .sidebar-toggle-btn:active,
    #app.has-sheet.sidebar-hidden .sidebar-toggle-btn:hover,
    #app.has-sheet.sidebar-hidden .sidebar-toggle-btn:active {
      transform: translateX(-50%);
    }
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: oklch(0.26 0.022 255);
    color: oklch(0.97 0.006 85);
    padding: 12px 24px;
    border-radius: 12px;
    box-shadow: 0 10px 30px oklch(0.3 0.022 255 / 0.15);
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  @keyframes highlight-glow {
    0% {
      box-shadow: 0 0 0 0px var(--highlight-color);
      transform: scale(1);
    }
    20% {
      box-shadow: 0 0 0 6px var(--highlight-color);
      transform: scale(1.03);
    }
    100% {
      box-shadow: 0 0 0 0px var(--highlight-color);
      transform: scale(1);
    }
  }
  .card-highlighted {
    animation: highlight-glow 2s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 5;
  }
  @keyframes control-panel-enter {
    0% {
      opacity: 0;
      transform: translateX(80px);
    }
    30% {
      opacity: 0;
      transform: translateX(80px);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }
  #app.mode-advance-entering .control-panel {
    animation: control-panel-enter 0.8s cubic-bezier(0.76, 0, 0.24, 1) both;
  }
  .timeline-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .timeline-card.dragging {
    opacity: 0.4;
    border: 2px dashed oklch(0.7 0.02 230) !important;
    background: oklch(0.97 0.01 230) !important;
    transform: scale(0.98);
    transition: none;
  }
  .timeline-card.drag-over {
    border-color: oklch(0.5 0.1 230) !important;
    border-style: dashed !important;
  }
  .timeline-cards-container::-webkit-scrollbar {
    width: 6px;
  }
  .timeline-cards-container::-webkit-scrollbar-thumb {
    background: oklch(0.85 0.016 230);
    border-radius: 4px;
  }

  /* Global Water Background Backdrop */
  .water-bg-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    background: oklch(0.98 0.01 230);
  }
  .water-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.75;
    mix-blend-mode: multiply;
    animation: drift 20s infinite ease-in-out alternate;
  }
  .blob-1 {
    width: 100vw;
    height: 100vw;
    background: radial-gradient(circle, oklch(0.85 0.12 230) 0%, rgba(255,255,255,0) 70%);
    top: -20vh;
    left: -10vw;
    animation-duration: 25s;
  }
  .blob-2 {
    width: 90vw;
    height: 90vw;
    background: radial-gradient(circle, oklch(0.88 0.10 250) 0%, rgba(255,255,255,0) 70%);
    bottom: -10vh;
    right: -10vw;
    animation-duration: 30s;
    animation-delay: -5s;
  }
  .blob-3 {
    width: 80vw;
    height: 80vw;
    background: radial-gradient(circle, oklch(0.82 0.14 195) 0%, rgba(255,255,255,0) 70%);
    top: 30vh;
    left: 40vw;
    animation-duration: 22s;
    animation-delay: -10s;
  }
  .water-frosted-overlay {
    position: absolute;
    inset: 0;
    backdrop-filter: blur(60px) saturate(130%);
    background: oklch(0.975 0.016 230 / 0.45);
  }

  /* Global Video Backdrop (matching index.html) */
  .header-video-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
    /* Water-inspired gradient fallback (no video load needed on mobile data) */
    background: radial-gradient(ellipse 80% 60% at 30% 20%, oklch(0.85 0.10 230 / 0.5) 0%, transparent 80%),
                radial-gradient(ellipse 70% 50% at 80% 80%, oklch(0.82 0.14 195 / 0.4) 0%, transparent 70%),
                linear-gradient(135deg, oklch(0.92 0.05 220), oklch(0.96 0.02 240));
  }
  .header-video-bg.has-video {
    background: none;
  }
  .header-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(10px) saturate(110%);
    opacity: 0.55;
    transform: scale(1.25);
  }
  .header-video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 30%,
      oklch(0.98 0.01 230 / 0.4) 100%
    );
  }

  @keyframes drift {
    0% {
      transform: translate(0, 0) scale(1) rotate(0deg);
    }
    50% {
      transform: translate(10vw, 8vh) scale(1.15) rotate(180deg);
    }
    100% {
      transform: translate(-10vw, -10vh) scale(0.9) rotate(360deg);
    }
  }

  .app-backdrop-wrapper {
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #app.session-active .app-backdrop-wrapper {
    opacity: 0;
  }

  .sidebar-toggle-mount {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 950;
  }
  .sidebar-toggle-btn {
    position: absolute;
    right: 43%;
    top: 50%;
    transform: translate(50%, -50%);
    width: 88px;
    height: 88px;
    border-radius: 16px;
    background: oklch(1 0 0);
    border: 1px solid oklch(0.9 0.016 230);
    box-shadow: 0 4px 12px oklch(0.3 0.022 255 / 0.12);
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: transform 0.75s cubic-bezier(0.76, 0, 0.24, 1),
                right 0.75s cubic-bezier(0.76, 0, 0.24, 1),
                background-color 0.2s ease,
                border-color 0.2s ease;
    color: oklch(0.3 0.022 255);
  }
  .sidebar-toggle-btn:hover {
    background: oklch(0.975 0.016 230);
    transform: translate(50%, -50%) scale(1.08);
  }
  .sidebar-toggle-btn:active {
    transform: translate(50%, -50%) scale(0.95);
  }

  #app.sidebar-hidden .sidebar-toggle-btn {
    right: 0;
    transform: translate(-10px, -50%);
  }
  #app.sidebar-hidden .sidebar-toggle-btn:hover {
    transform: translate(-10px, -50%) scale(1.08);
  }
  #app.sidebar-hidden .sidebar-toggle-btn:active {
    transform: translate(-10px, -50%) scale(0.95);
  }
</style>
</head>
<body>
<div id="mobile-topbar">CREWCALL</div>
<div id="app">
  <div class="app-left">
    <!-- Sticky Column Background (constrained to left panel) -->
    <div class="app-backdrop-wrapper" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;">
      <div style="position: sticky; top: 0; width: 100%; height: 100vh; overflow: hidden;">
        <!-- Frosted Moving Water Backdrop -->
        <div class="water-bg-container">
          <div class="water-blob blob-1"></div>
          <div class="water-blob blob-2"></div>
          <div class="water-blob blob-3"></div>
          <div class="water-frosted-overlay"></div>
        </div>

        <!-- Header Video Backdrop — gradient shown by default; video loaded on fast connections -->
        <div class="header-video-bg" id="headerVideoBgApp">
          <div class="header-video-overlay"></div>
        </div>
      </div>
    </div>

    <div class="app-left-content" style="position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 3;"></div>
  </div>
  <div class="app-right"></div>
  <div class="mobile-sheet-scrim" data-act="toggleSidebar"></div>
  <div class="sidebar-toggle-mount"></div>
</div>
<input type="file" id="config-upload-input" accept=".json" style="display:none">

<script>
  // Lazy-load hero video on fast connections only
  (function(){
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    var isFast = !conn || conn.type === 'wifi' || conn.type === 'ethernet' ||
      (conn.effectiveType && (conn.effectiveType === '4g' || conn.effectiveType === '5g'));
    var reducedData = conn && conn.saveData === true;
    if (isFast && !reducedData) {
      var container = document.getElementById('headerVideoBgApp');
      var video = document.createElement('video');
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.className = 'header-video';
      video.innerHTML = '<source src="hero-bg.mp4" type="video/mp4">';
      container.prepend(video);
      container.classList.add('has-video');
    }
  })();
</script>
