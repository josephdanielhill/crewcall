<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewCall — Interval Rowing Coach</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:oklch(0.975 0.006 85);}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:oklch(0.85 0.01 85);border-radius:8px;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  button{font-family:inherit;}

  .btn-start{background:oklch(0.3 0.012 70);}
  .btn-start:hover{background:oklch(0.24 0.012 70);}
  .btn-soft:hover{background:oklch(0.97 0.006 85);}
  .btn-danger:hover{background:oklch(0.97 0.02 27);}
  .btn-surprise:hover{background:oklch(0.97 0.025 27);}
  .btn-stepper:hover{background:oklch(0.95 0.006 85);}
  .btn-stepper-soft:hover{background:oklch(0.95 0.006 85);}
  .btn-disabled{opacity:0.3;pointer-events:none;}
</style>
</head>
<body>
<div id="app" style="display:flex;height:100vh;width:100%;overflow:hidden;color:oklch(0.26 0.012 70);"></div>

<script>
(function(){
  "use strict";

  var COLORS = {
    high:   { name:'HIGH',   fill:'oklch(0.71 0.145 27)',  tint:'oklch(0.93 0.05 27)',  ink:'oklch(0.45 0.15 27)' },
    medium: { name:'MEDIUM', fill:'oklch(0.83 0.12 82)',   tint:'oklch(0.93 0.06 82)',  ink:'oklch(0.52 0.12 70)' },
    low:    { name:'LOW',    fill:'oklch(0.80 0.095 158)', tint:'oklch(0.93 0.05 158)', ink:'oklch(0.46 0.09 160)' },
  };
  var RATIOS = { high:2, medium:3, low:4 };
  var MINLEN = 15;
  var SOUND_ENABLED = true;
  var COUNTDOWN_BEEPS = true;

  var state = {
    mode: 'setup',
    config: { high:{count:5,len:45,rate:30}, medium:{count:4,len:90,rate:28}, low:{count:4,len:120,rate:24} },
    targetMin: 10,
    elapsed: 0, baseElapsed: 0, runStart: 0,
    sequence: [], ends: [], totalDuration: 0,
    lastSegIndex: -1, lastCountTick: null, raf: null, actx: null,
  };

  function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }

  function arrange(h,m,l){
    var pools={ high:h, medium:m, low:l };
    var total=h+m+l;
    if(total===0) return [];
    var remaining={high:pools.high,medium:pools.medium,low:pools.low}, placed={high:0,medium:0,low:0};
    var order=['low','medium','high','medium']; // cycle bias: low -> medium -> high -> medium ...
    var seq=[]; var prev=null;
    for(var i=0;i<total;i++){
      var best=null, bestScore=-Infinity;
      if(i===0){ best = remaining.low>0 ? 'low' : (remaining.medium>0 ? 'medium' : 'high'); seq.push(best); remaining[best]--; placed[best]++; prev=best; continue; }
      var progress=(i+1)/total;
      ['high','medium','low'].forEach(function(k){
        if(remaining[k]<=0) return;
        var score = progress*pools[k] - placed[k];
        if(k===prev) score -= 1.0;            // strongly avoid back-to-back repeats
        score += order.indexOf(k)*0.0001;     // tiny tie-break toward low->med->high feel
        if(score>bestScore){ bestScore=score; best=k; }
      });
      seq.push(best); remaining[best]--; placed[best]++; prev=best;
    }
    return seq;
  }

  function curCounts(){ var c=state.config; return { high:c.high.count, medium:c.medium.count, low:c.low.count }; }
  function computeLen(targetSec, counts){
    var R=RATIOS; var tr=counts.high*R.high+counts.medium*R.medium+counts.low*R.low;
    if(tr===0) return {high:0,medium:0,low:0};
    var u=targetSec/tr;
    return { high:Math.max(1,Math.round(R.high*u)), medium:Math.max(1,Math.round(R.medium*u)), low:Math.max(1,Math.round(R.low*u)) };
  }
  function minPresentLen(L, counts){ var mn=Infinity; ['high','medium','low'].forEach(function(k){ if(counts[k]>0) mn=Math.min(mn,L[k]); }); return mn; }
  function canAdd(k){ if(state.config[k].count>=12) return false; var counts=curCounts(); counts[k]++; var L=computeLen(state.targetMin*60,counts); return minPresentLen(L,counts)>=MINLEN; }
  function canSetTarget(targetSec){ var counts=curCounts(); var L=computeLen(targetSec,counts); return minPresentLen(L,counts)>=MINLEN; }
  function buildPreview(){ var counts=curCounts(); var L=computeLen(state.targetMin*60,counts); return arrange(counts.high,counts.medium,counts.low).map(function(k){ return {intensity:k,len:L[k]}; }); }

  function surprise(){
    var tgt=state.targetMin*60; var kinds=['high','medium','low'];
    var counts={high:0,medium:0,low:0}; var guard=0;
    var want=5+Math.floor(Math.random()*6);
    while((counts.high+counts.medium+counts.low)<want && guard<300){
      guard++;
      var k=kinds[Math.floor(Math.random()*3)];
      if(counts[k]>=12) continue;
      var test={high:counts.high,medium:counts.medium,low:counts.low}; test[k]++;
      var L=computeLen(tgt,test);
      if(minPresentLen(L,test)>=MINLEN){ counts=test; } else break;
    }
    if(counts.high+counts.medium+counts.low===0){ counts.low=1; }
    state.config.high.count=counts.high; state.config.medium.count=counts.medium; state.config.low.count=counts.low;
    render();
  }

  function build(){
    state.sequence=buildPreview();
    var t=0;
    state.ends=state.sequence.map(function(s){ t+=s.len; return t; });
    state.totalDuration=t;
  }

  function ensureAudio(){ try{ if(!state.actx) state.actx=new (window.AudioContext||window.webkitAudioContext)(); if(state.actx.state==='suspended') state.actx.resume(); }catch(e){} }
  function beep(freq,dur,gain){
    dur = dur===undefined?0.12:dur; gain = gain===undefined?0.06:gain;
    if(!SOUND_ENABLED) return;
    var ctx=state.actx; if(!ctx) return;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    var t=ctx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  function transitionBeep(k){ var f = k==='high'?740 : k==='medium'?580 : 460; beep(f,0.14,0.07); setTimeout(function(){ beep(f*1.5,0.16,0.06); },130); }
  function countBeep(){ if(!COUNTDOWN_BEEPS) return; beep(430,0.06,0.05); }
  function completeBeep(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,0.18,0.07); }, i*150); }); }

  function segIndexAt(e){ for(var i=0;i<state.ends.length;i++){ if(e<state.ends[i]) return i; } return state.ends.length-1; }
  function segStart(i){ return i===0?0:state.ends[i-1]; }

  function start(){
    build(); if(state.sequence.length===0) return;
    ensureAudio();
    state.mode='running'; state.elapsed=0; state.baseElapsed=0; state.runStart=performance.now();
    state.lastSegIndex=-1; state.lastCountTick=null;
    loop(); render();
  }
  function loop(){ if(state.raf) cancelAnimationFrame(state.raf); state.raf=requestAnimationFrame(tick); }
  function tick(){
    if(state.mode!=='running') return;
    var now=performance.now();
    state.elapsed=state.baseElapsed+(now-state.runStart)/1000;
    if(state.elapsed>=state.totalDuration){ state.elapsed=state.totalDuration; finish(); return; }
    var idx=segIndexAt(state.elapsed);
    if(idx!==state.lastSegIndex){ state.lastSegIndex=idx; transitionBeep(state.sequence[idx].intensity); state.lastCountTick=null; }
    var remain=state.ends[idx]-state.elapsed; var rc=Math.ceil(remain);
    if(rc<=3 && rc>=1 && rc!==state.lastCountTick){ state.lastCountTick=rc; countBeep(); }
    render();
    state.raf=requestAnimationFrame(tick);
  }
  function pause(){ if(state.mode!=='running') return; state.baseElapsed=state.elapsed; state.mode='paused'; if(state.raf) cancelAnimationFrame(state.raf); render(); }
  function resume(){ if(state.mode!=='paused') return; state.runStart=performance.now(); state.mode='running'; ensureAudio(); loop(); render(); }
  function togglePause(){ state.mode==='running'?pause():resume(); }
  function skip(){
    if(state.mode!=='running'&&state.mode!=='paused') return;
    var idx=segIndexAt(state.elapsed); var ns=state.ends[idx];
    if(ns>=state.totalDuration){ finish(); return; }
    state.baseElapsed=ns+0.001; state.elapsed=state.baseElapsed; state.runStart=performance.now();
    if(state.mode==='running') loop();
    render();
  }
  function stop(){ state.mode='setup'; if(state.raf) cancelAnimationFrame(state.raf); state.elapsed=0; state.baseElapsed=0; render(); }
  function finish(){ state.mode='done'; state.elapsed=state.totalDuration; if(state.raf) cancelAnimationFrame(state.raf); completeBeep(); render(); }
  function restart(){ start(); }
  function change(k,field,delta){ var c=state.config[k]; if(field==='count'){ if(delta>0 && !canAdd(k)) return; c.count=Math.max(0,Math.min(12,c.count+delta)); } render(); }
  function changeTarget(delta){ var nv=state.targetMin+delta*5; if(nv<10||nv>90) return; if(delta<0 && !canSetTarget(nv*60)) return; state.targetMin=nv; render(); }

  document.addEventListener('keydown', function(e){
    if(e.code==='Space' && (state.mode==='running'||state.mode==='paused')){ e.preventDefault(); state.mode==='running'?pause():resume(); }
  });

  var ACTIONS = {
    start: start, togglePause: togglePause, skip: skip, stop: stop, restart: restart, surprise: surprise,
    incTarget: function(){ changeTarget(1); }, decTarget: function(){ changeTarget(-1); },
    incHc: function(){ change('high','count',1); }, decHc: function(){ change('high','count',-1); },
    incMc: function(){ change('medium','count',1); }, decMc: function(){ change('medium','count',-1); },
    incLc: function(){ change('low','count',1); }, decLc: function(){ change('low','count',-1); },
  };

  var app = document.getElementById('app');
  app.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if(!el) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if(fn) fn();
  });

  function esc(s){ return String(s); }

  function renderVals(){
    var c=state.config, CO=COLORS;
    var isSetup=state.mode==='setup', isDone=state.mode==='done';
    var isActive=state.mode==='running'||state.mode==='paused';

    var prev=buildPreview();
    var pt=0; var previewSegs=prev.map(function(s){ pt+=s.len; return {flex:s.len, color:CO[s.intensity].fill}; });
    var tgt=state.targetMin*60; var counts=curCounts(); var L=computeLen(tgt,counts);
    var lenT=function(k){ return counts[k]? fmt(L[k]) : '—'; };
    var subT=function(k){ return counts[k]? counts[k]+' × '+fmt(L[k]) : 'none'; };

    var useSeq = isSetup?prev:state.sequence;
    var acc=0; var ends = isSetup? useSeq.map(function(s){acc+=s.len;return acc;}) : state.ends;
    var curIdx = isActive? segIndexAt(state.elapsed) : (isDone? useSeq.length-1 : -1);

    var segViews = useSeq.map(function(s,i){
      var co=CO[s.intensity]; var ss=i===0?0:ends[i-1];
      var status='upcoming';
      if(isDone) status='done';
      else if(isActive){ status = i<curIdx?'done' : (i===curIdx?'active':'upcoming'); }
      var segElapsed = (isActive && i===curIdx) ? Math.max(0,Math.min(s.len, state.elapsed-ss)) : (status==='done'?s.len:0);
      var pPct = Math.max(0,Math.min(100,(segElapsed/s.len)*100));
      return {
        idxText:String(i+1).padStart(2,'0'), label:co.name, durText:fmt(s.len),
        color:co.fill, ink:co.ink, tint:co.tint, flex:s.len,
        status: status,
        rowOpacity: status==='done'?0.42:1,
        rowBg: status==='active'?'oklch(1 0 0)':'transparent',
        rowBorder: status==='active'?'oklch(0.84 0.02 85)':'oklch(0.93 0.006 85)',
        phasePctText: status==='active'? pPct+'%' : '0%',
        barOpacity: status==='upcoming'?0.3:1,
      };
    });

    var phaseLabel='',phaseFill='oklch(0.965 0.004 85)',phaseInk='oklch(0.3 0.012 70)',phaseRemain='',phaseHeight='0%',phaseIdx='',nextLabel='',nextInk='',phaseStrokes='';
    if(isActive){
      var s=state.sequence[curIdx], co=CO[s.intensity];
      var remain=state.ends[curIdx]-state.elapsed; var frac=Math.max(0,Math.min(1,remain/s.len));
      var nx=state.sequence[curIdx+1];
      phaseLabel=co.name; phaseFill=co.fill; phaseInk=co.ink;
      phaseRemain=fmt(Math.ceil(remain)); phaseHeight=(frac*100)+'%';
      phaseIdx=(curIdx+1)+' / '+state.sequence.length;
      phaseStrokes=String(c[s.intensity].rate);
      nextLabel = nx?CO[nx.intensity].name:'FINISH'; nextInk = nx?CO[nx.intensity].ink:CO.low.ink;
    }

    var total = isSetup?pt:state.totalDuration;
    var overallPct = (isActive||isDone)&&total? Math.max(0,Math.min(100,(state.elapsed/total)*100)) : 0;

    return {
      isSetup:isSetup, isActive:isActive, isDone:isDone, showList:isActive||isDone,
      canStart: prev.length>0, cannotStart: prev.length===0,
      previewSegs:previewSegs, segViews:segViews,
      setupTotalText:fmt(pt), setupCount:useSeq.length,
      targetText:fmt(state.targetMin*60),
      hrate:c.high.rate, mrate:c.medium.rate, lrate:c.low.rate,
      elapsedText:fmt(state.elapsed), totalText:fmt(total),
      overallPctText: overallPct+'%',
      pauseLabel: state.mode==='paused'?'Resume':'Pause',
      phaseLabel:phaseLabel, phaseFill:phaseFill, phaseInk:phaseInk, phaseRemain:phaseRemain, phaseHeight:phaseHeight, phaseIdx:phaseIdx, nextLabel:nextLabel, nextInk:nextInk, phaseStrokes:phaseStrokes,
      hc:c.high.count, mc:c.medium.count, lc:c.low.count,
      hlenText:lenT('high'), mlenText:lenT('medium'), llenText:lenT('low'),
      hsub:subT('high'), msub:subT('medium'), lsub:subT('low'),
      addHDisabled: !canAdd('high'), addMDisabled: !canAdd('medium'), addLDisabled: !canAdd('low'),
      decTargetDisabled: !(state.targetMin>10 && canSetTarget((state.targetMin-5)*60)), incTargetDisabled: !(state.targetMin<90),
    };
  }

  function stepperBtn(act, disabled, soft, label){
    var cls = soft ? 'btn-stepper-soft' : 'btn-stepper';
    var bg = soft ? 'oklch(0.985 0.005 85)' : 'oklch(1 0 0)';
    var border = soft ? 'oklch(0.86 0.01 85)' : 'oklch(0.84 0.01 85)';
    return '<button data-act="'+act+'" class="'+cls+(disabled?' btn-disabled':'')+'" style="width:44px;height:44px;cursor:pointer;border:1px solid '+border+';background:'+bg+';border-radius:11px;font-size:22px;color:oklch(0.35 0.012 70);">'+label+'</button>';
  }

  function intensityCard(label, dotColor, inkColor, badgeBg, rate, count, sub, decAct, incAct, addDisabled, lenText){
    return ''+
    '<div style="border:1px solid oklch(0.9 0.006 85);border-radius:18px;padding:22px 24px;background:oklch(1 0 0);">'+
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">'+
        '<span style="width:13px;height:13px;border-radius:50%;background:'+dotColor+';"></span>'+
        '<span style="font-size:16px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:'+inkColor+';">'+label+'</span>'+
        '<span style="font-family:\'Space Grotesk\';font-size:13px;color:'+inkColor+';background:'+badgeBg+';padding:4px 11px;border-radius:20px;">'+rate+' strokes</span>'+
        '<span style="margin-left:auto;font-size:14px;color:oklch(0.58 0.012 70);font-family:\'Space Grotesk\';">'+sub+'</span>'+
      '</div>'+
      '<div style="display:flex;gap:28px;">'+
        '<div style="flex:1;">'+
          '<div style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.6 0.012 70);margin-bottom:9px;">Intervals</div>'+
          '<div style="display:flex;align-items:center;gap:14px;">'+
            stepperBtn(decAct, false, true, '−')+
            '<span style="font-family:\'Space Grotesk\';font-size:26px;font-weight:500;min-width:28px;text-align:center;color:oklch(0.3 0.012 70);">'+count+'</span>'+
            stepperBtn(incAct, addDisabled, true, '+')+
          '</div>'+
        '</div>'+
        '<div style="flex:1;">'+
          '<div style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.6 0.012 70);margin-bottom:9px;">Length each</div>'+
          '<div style="display:flex;align-items:center;gap:10px;height:44px;">'+
            '<span style="font-family:\'Space Grotesk\';font-size:26px;font-weight:500;color:oklch(0.3 0.012 70);font-variant-numeric:tabular-nums;">'+lenText+'</span>'+
            '<span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.62 0.012 70);">auto</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function renderLeft(v){
    if(v.isSetup){
      return ''+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:64px 60px;background:oklch(0.972 0.006 85);">'+
        '<div>'+
          '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">'+
            '<img src="favicon.png" style="width:32px;height:32px;border-radius:8px;">'+
            '<div style="font-family:\'Space Grotesk\';font-weight:600;font-size:20px;letter-spacing:0.16em;color:oklch(0.3 0.012 70);">CREWCALL</div>'+
          '</div>'+
          '<div style="font-size:15px;color:oklch(0.6 0.012 70);letter-spacing:0.02em;">Interval rowing coach</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:24px;">'+
          '<div style="display:flex;align-items:flex-end;gap:40px;">'+
            '<div>'+
              '<div style="font-family:\'Space Grotesk\';font-weight:500;font-size:120px;line-height:0.9;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:oklch(0.3 0.012 70);">'+v.setupTotalText+'</div>'+
              '<div style="margin-top:10px;display:flex;align-items:center;gap:12px;">'+
                '<span style="font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.58 0.012 70);">Total session</span>'+
                '<span style="font-family:\'Space Grotesk\';font-size:13px;color:oklch(0.5 0.012 70);background:oklch(0.93 0.008 85);padding:3px 11px;border-radius:20px;">Goal '+v.targetText+'</span>'+
              '</div>'+
            '</div>'+
            '<div style="padding-bottom:14px;">'+
              '<div style="font-family:\'Space Grotesk\';font-weight:500;font-size:52px;line-height:1;color:oklch(0.42 0.012 70);">'+v.setupCount+'</div>'+
              '<div style="margin-top:8px;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.58 0.012 70);">Intervals</div>'+
            '</div>'+
          '</div>'+
          '<div style="display:flex;gap:3px;height:14px;border-radius:8px;overflow:hidden;width:100%;">'+
            v.previewSegs.map(function(seg){ return '<div style="flex:'+seg.flex+';background:'+seg.color+';border-radius:3px;"></div>'; }).join('')+
          '</div>'+
        '</div>'+
        '<div>'+
          (v.canStart ?
            '<button data-act="start" class="btn-start" style="display:flex;align-items:center;gap:16px;border:none;cursor:pointer;color:oklch(0.97 0.006 85);padding:22px 38px;border-radius:16px;font-size:19px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;animation:breathe 4.5s ease-in-out infinite;">'+
              '<span style="width:9px;height:9px;border-radius:50%;background:oklch(0.8 0.095 158);"></span>'+
              'Start session'+
            '</button>'
          : '<div style="font-size:16px;color:oklch(0.6 0.012 70);">Add at least one interval to begin →</div>')+
        '</div>'+
      '</div>';
    }
    if(v.isActive){
      return ''+
      '<div style="position:absolute;inset:0;background:oklch(0.965 0.004 85);overflow:hidden;">'+
        '<div style="position:absolute;left:0;right:0;bottom:0;height:'+v.phaseHeight+';background:'+v.phaseFill+';transition:background 0.4s ease;"></div>'+
        '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
            '<div style="display:flex;align-items:center;gap:14px;">'+
              '<span style="width:14px;height:14px;border-radius:50%;background:'+v.phaseInk+';"></span>'+
              '<span style="font-size:15px;letter-spacing:0.18em;text-transform:uppercase;color:oklch(0.4 0.012 70);">Interval '+v.phaseIdx+'</span>'+
            '</div>'+
            '<div style="text-align:right;font-size:15px;letter-spacing:0.06em;color:oklch(0.45 0.012 70);">'+
              'Next&nbsp;·&nbsp;<span style="color:'+v.nextInk+';font-weight:600;">'+v.nextLabel+'</span>'+
            '</div>'+
          '</div>'+
          '<div style="text-align:center;">'+
            '<div style="font-size:34px;font-weight:600;letter-spacing:0.34em;text-transform:uppercase;color:'+v.phaseInk+';">'+v.phaseLabel+'</div>'+
            '<div style="font-family:\'Space Grotesk\';font-weight:500;font-size:200px;line-height:0.92;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:'+v.phaseInk+';margin-top:6px;">'+v.phaseRemain+'</div>'+
            '<div style="margin-top:4px;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.5 0.012 70);">remaining in phase</div>'+
            '<div style="margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border-radius:30px;background:oklch(1 0 0 / 0.5);border:1px solid '+v.phaseInk+';">'+
              '<span style="font-family:\'Space Grotesk\';font-size:26px;font-weight:600;color:'+v.phaseInk+';">'+v.phaseStrokes+'</span>'+
              '<span style="font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:'+v.phaseInk+';">strokes&nbsp;·&nbsp;target</span>'+
            '</div>'+
          '</div>'+
          '<div style="display:flex;flex-direction:column;gap:22px;">'+
            '<div>'+
              '<div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:14px;letter-spacing:0.04em;color:oklch(0.45 0.012 70);">'+
                '<span>Session</span>'+
                '<span style="font-family:\'Space Grotesk\';font-variant-numeric:tabular-nums;">'+v.elapsedText+' / '+v.totalText+'</span>'+
              '</div>'+
              '<div style="position:relative;display:flex;gap:2px;height:10px;">'+
                v.segViews.map(function(seg){ return '<div style="flex:'+seg.flex+';background:'+seg.color+';opacity:'+seg.barOpacity+';border-radius:2px;"></div>'; }).join('')+
                '<div style="position:absolute;top:-3px;bottom:-3px;left:'+v.overallPctText+';width:2px;background:oklch(0.3 0.012 70);border-radius:2px;"></div>'+
              '</div>'+
            '</div>'+
            '<div style="display:flex;gap:12px;">'+
              '<button data-act="togglePause" class="btn-soft" style="flex:1;cursor:pointer;border:1px solid oklch(0.78 0.012 70);background:oklch(1 0 0);color:oklch(0.3 0.012 70);padding:16px;border-radius:13px;font-size:15px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">'+v.pauseLabel+'</button>'+
              '<button data-act="skip" class="btn-soft" style="flex:1;cursor:pointer;border:1px solid oklch(0.78 0.012 70);background:oklch(1 0 0);color:oklch(0.3 0.012 70);padding:16px;border-radius:13px;font-size:15px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">Skip</button>'+
              '<button data-act="stop" class="btn-danger" style="flex:0 0 auto;cursor:pointer;border:1px solid oklch(0.82 0.05 27);background:oklch(1 0 0);color:oklch(0.5 0.12 27);padding:16px 22px;border-radius:13px;font-size:15px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">End</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }
    if(v.isDone){
      return ''+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px;background:oklch(0.972 0.006 85);">'+
        '<div style="font-size:30px;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;color:oklch(0.46 0.09 160);">Complete</div>'+
        '<div style="font-family:\'Space Grotesk\';font-weight:500;font-size:140px;line-height:0.95;letter-spacing:-0.02em;color:oklch(0.3 0.012 70);margin:14px 0 6px;">'+v.totalText+'</div>'+
        '<div style="font-size:16px;letter-spacing:0.06em;color:oklch(0.55 0.012 70);">'+v.setupCount+' intervals · nicely done</div>'+
        '<div style="display:flex;gap:12px;margin-top:40px;">'+
          '<button data-act="restart" class="btn-start" style="cursor:pointer;border:none;color:oklch(0.97 0.006 85);padding:18px 32px;border-radius:14px;font-size:16px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">Repeat session</button>'+
          '<button data-act="stop" class="btn-soft" style="cursor:pointer;border:1px solid oklch(0.78 0.012 70);background:oklch(1 0 0);color:oklch(0.3 0.012 70);padding:18px 32px;border-radius:14px;font-size:16px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">Edit plan</button>'+
        '</div>'+
      '</div>';
    }
    return '';
  }

  function renderRight(v){
    if(v.isSetup){
      return ''+
      '<div style="display:flex;flex-direction:column;height:100%;padding:52px 48px;overflow-y:auto;">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">'+
          '<div>'+
            '<div style="font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.58 0.012 70);">Build your session</div>'+
            '<div style="font-size:24px;font-weight:600;color:oklch(0.3 0.012 70);margin-top:8px;letter-spacing:-0.01em;">Set the time, stack the work.</div>'+
          '</div>'+
          '<button data-act="surprise" class="btn-surprise" style="flex:0 0 auto;cursor:pointer;border:1px solid oklch(0.8 0.05 27);background:oklch(1 0 0);color:oklch(0.48 0.13 27);padding:11px 17px;border-radius:30px;font-size:14px;font-weight:600;letter-spacing:0.03em;display:flex;align-items:center;gap:9px;white-space:nowrap;">'+
            '<span style="width:7px;height:7px;border-radius:50%;background:oklch(0.71 0.145 27);"></span>Surprise me'+
          '</button>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:14px;margin-top:34px;">'+
          '<div style="border:1px solid oklch(0.87 0.012 85);border-radius:18px;padding:20px 24px;background:oklch(0.965 0.012 85);display:flex;align-items:center;justify-content:space-between;gap:18px;">'+
            '<div>'+
              '<div style="font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.4 0.012 70);">Session length</div>'+
              '<div style="font-size:13px;color:oklch(0.6 0.012 70);margin-top:4px;">Target time · 5-minute steps</div>'+
            '</div>'+
            '<div style="display:flex;align-items:center;gap:14px;">'+
              stepperBtn('decTarget', v.decTargetDisabled, false, '−')+
              '<span style="font-family:\'Space Grotesk\';font-size:30px;font-weight:500;min-width:78px;text-align:center;font-variant-numeric:tabular-nums;color:oklch(0.3 0.012 70);">'+v.targetText+'</span>'+
              stepperBtn('incTarget', v.incTargetDisabled, false, '+')+
            '</div>'+
          '</div>'+
          intensityCard('High','oklch(0.71 0.145 27)','oklch(0.45 0.15 27)','oklch(0.93 0.05 27)',v.hrate,v.hc,v.hsub,'decHc','incHc',v.addHDisabled,v.hlenText)+
          intensityCard('Medium','oklch(0.83 0.12 82)','oklch(0.52 0.12 70)','oklch(0.93 0.06 82)',v.mrate,v.mc,v.msub,'decMc','incMc',v.addMDisabled,v.mlenText)+
          intensityCard('Low','oklch(0.80 0.095 158)','oklch(0.46 0.09 160)','oklch(0.93 0.05 158)',v.lrate,v.lc,v.lsub,'decLc','incLc',v.addLDisabled,v.llenText)+
        '</div>'+
        '<div style="margin-top:auto;padding-top:26px;font-size:13px;color:oklch(0.6 0.012 70);letter-spacing:0.02em;">'+
          'Session length is fixed. Add or remove intervals and each one’s length adjusts to fit — the more you stack, the shorter each gets. “Surprise me” builds a balanced session for you.'+
        '</div>'+
      '</div>';
    }
    if(v.showList){
      return ''+
      '<div style="display:flex;flex-direction:column;height:100%;">'+
        '<div style="padding:36px 40px 22px;border-bottom:1px solid oklch(0.91 0.006 85);">'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;">'+
            '<div style="font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:oklch(0.58 0.012 70);">Session plan</div>'+
            '<div style="font-family:\'Space Grotesk\';font-size:15px;font-variant-numeric:tabular-nums;color:oklch(0.5 0.012 70);">'+v.elapsedText+' / '+v.totalText+'</div>'+
          '</div>'+
        '</div>'+
        '<div style="flex:1;overflow-y:auto;padding:16px 24px 28px;display:flex;flex-direction:column;gap:6px;">'+
          v.segViews.map(function(seg){
            return '<div style="position:relative;display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:13px;background:'+seg.rowBg+';border:1px solid '+seg.rowBorder+';opacity:'+seg.rowOpacity+';overflow:hidden;">'+
              '<div style="position:absolute;left:0;top:0;bottom:0;width:'+seg.phasePctText+';background:'+seg.tint+';opacity:0.6;"></div>'+
              '<span style="position:relative;width:11px;height:11px;border-radius:50%;background:'+seg.color+';flex:0 0 auto;"></span>'+
              '<span style="position:relative;font-family:\'Space Grotesk\';font-size:14px;color:oklch(0.6 0.012 70);min-width:22px;font-variant-numeric:tabular-nums;">'+seg.idxText+'</span>'+
              '<span style="position:relative;font-size:15px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:'+seg.ink+';">'+seg.label+'</span>'+
              '<span style="position:relative;margin-left:auto;font-family:\'Space Grotesk\';font-size:16px;font-variant-numeric:tabular-nums;color:oklch(0.4 0.012 70);">'+seg.durText+'</span>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>';
    }
    return '';
  }

  function render(){
    var v = renderVals();
    app.innerHTML =
      '<div style="flex:0 0 57%;position:relative;display:flex;flex-direction:column;border-right:1px solid oklch(0.9 0.006 85);">'+renderLeft(v)+'</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;background:oklch(0.985 0.005 85);min-width:0;">'+renderRight(v)+'</div>';
  }

  render();
})();
</script>
</body>
</html>
